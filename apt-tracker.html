function renderChart() {
  const wrap = document.getElementById('chart-svg-wrap');
  const legendBar = document.getElementById('chart-legend-bar');
  if (!selectedAptIds.length) return;

  // apt+pyeong 조합별 시리즈 (선택 순서대로 색상 부여)
  const series = selectedAptIds.map((sel, i) => {
    const apt = apartments.find(a => a.id === sel.aptId);
    const txMap = transactions[sel.aptId] || {};
    const txs = (txMap[sel.pyeong] || []).slice().reverse();
    // 같은 아파트가 여러 개면 라벨에 평형 포함
    const sameAptCount = selectedAptIds.filter(s => s.aptId === sel.aptId).length;
    return {
      id: sel.aptId, apt, pyeong: sel.pyeong, txs,
      color: CHART_COLORS[i % CHART_COLORS.length],
      dashed: false,
      label: escapeHtml(sameAptCount > 1 || selectedAptIds.some(s => s.aptId !== sel.aptId && apartments.find(a=>a.id===s.aptId)?.aptName === apt?.aptName)
        ? `${apt?.aptName}${apt?.dong?' '+apt.dong:''} ${PYEONG_DEFS[sel.pyeong]?.label||''}`.trim()
        : apt?.aptName || ''),
    };
  });

  const allTxs = series.flatMap(s => s.txs);
  if (!allTxs.length) {
    wrap.innerHTML = `<div style="height:240px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px">선택한 평형의 거래 내역 없음</div>`;
    legendBar.innerHTML = '';
    return;
  }

  // 전체 날짜 범위 계산 (3개월 고정)
  const now = new Date();
  const startDate = new Date(now.getFullYear(), now.getMonth()-(currentPeriod-1), 1);
  const endDate = now;
  const totalDays = Math.max((endDate - startDate) / 86400000, 1);

  function dateToX(tx, cw, padL) {
    const d = new Date(+tx.year, +tx.month-1, +tx.day);
    const ratio = Math.max(0, Math.min(1, (d - startDate) / (endDate - startDate)));
    return padL + ratio * cw;
  }

  // 전체 가격 범위
  const allPrices = allTxs.map(t=>t.price);
  const globalMax = Math.max(...allPrices);
  const globalMin = Math.min(...allPrices);
  const priceRange = globalMax - globalMin || globalMax * 0.05 || 1;
  // 여백 15% (격차 강조)
  const yMin = globalMin - priceRange * 0.15;
  const yMax = globalMax + priceRange * 0.15;
  const yRange = yMax - yMin;

  const W = wrap.clientWidth || 520, H = 420;
  const seriesCount = series.filter(s=>s.txs.length).length;
  const topPad = 32 + Math.max(0, seriesCount) * 22; // 시리즈당 라벨 공간
  const pad = {t:topPad, r:24, b:48, l:84};
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;

  function priceToY(price) {
    return pad.t + ch - ((price - yMin) / yRange * ch);
  }

  // 그리드 & Y축
  const gridCount = 7;
  const gridLines = Array.from({length:gridCount}, (_,i) => {
    const r = i/(gridCount-1);
    const price = yMin + yRange * r;
    const y = pad.t + ch - r*ch;
    return `
      <line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="#1a2235" stroke-width="1" stroke-dasharray="${i===0?'none':'4,3'}"/>
      <text x="${pad.l-6}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="#4a5568" font-size="11" font-family="IBM Plex Mono">${formatPrice(Math.round(price))}</text>`;
  }).join('');

  // X축: 기간에 따라 적절한 눈금 생성
  const xAxisLabels = [];
  {
    // 눈금 간격 결정
    // 3개월→매월, 6개월→매월, 1년→격월, 5년→6개월마다
    const intervalMonths = currentPeriod <= 6 ? 1 : currentPeriod <= 12 ? 2 : currentPeriod <= 36 ? 3 : 6;

    // startDate의 다음 달 1일부터 시작
    let cursor = new Date(startDate.getFullYear(), startDate.getMonth() + 1, 1);
    const seen = new Set();

    while (cursor <= endDate) {
      const key = `${cursor.getFullYear()}-${cursor.getMonth()}`;
      if (!seen.has(key)) {
        seen.add(key);
        const ratio = Math.max(0, Math.min(1, (cursor - startDate) / (endDate - startDate)));
        const x = pad.l + ratio * cw;
        const yr = cursor.getFullYear();
        const mo = cursor.getMonth() + 1;
        // 1월이면 연도 표시, 나머지는 월만
        const label = mo === 1 ? `${yr}년` : `${mo}월`;
        const isBold = mo === 1;
        xAxisLabels.push(`<text x="${x.toFixed(1)}" y="${H-6}" text-anchor="middle"
          fill="${isBold ? '#718096' : '#4a5568'}" font-size="${isBold ? 10 : 10}"
          font-weight="${isBold ? '600' : '400'}">${label}</text>`);
        xAxisLabels.push(`<line x1="${x.toFixed(1)}" y1="${pad.t}" x2="${x.toFixed(1)}" y2="${(pad.t+ch).toFixed(1)}"
          stroke="${isBold ? '#2a3550' : '#1a2235'}" stroke-width="1" stroke-dasharray="4,3"/>`);
      }
      // 다음 눈금
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + intervalMonths, 1);
    }
  }

  // 각 시리즈 SVG 생성
  const defs = [];
  const paths = [];
  const dots = [];
  const trendLines = [];  // 회귀 추세선(깜빡임)
  const maxLabels = [];  // 최고가 라벨

  series.forEach((s, si) => {
    if (!s.txs.length) return;
    const c = s.color;
    const gradId = `grad${si}`;
    defs.push(`
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${c.line}" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="${c.line}" stop-opacity="0"/>
      </linearGradient>`);

    const pts = s.txs.map(tx => ({
      x: dateToX(tx, cw, pad.l),
      y: priceToY(tx.price),
      tx,
    }));

    const linePath = pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const areaPath = pts.length > 1
      ? `${linePath} L${pts[pts.length-1].x.toFixed(1)},${(pad.t+ch).toFixed(1)} L${pts[0].x.toFixed(1)},${(pad.t+ch).toFixed(1)} Z`
      : '';

    if (areaPath) paths.push(`<path d="${areaPath}" fill="url(#${gradId})"/>`);
    paths.push(`<path d="${linePath}" fill="none" stroke="${c.line}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"${s.dashed ? ' stroke-dasharray="6,4"' : ''}/>`);

    // ── 추세선 (좌표 선형 회귀) → 상승/횡보/하락 식별 + 깜빡이는 점선 ──
    if (pts.length >= 2) {
      const fit = linreg(pts.map(p => ({ x: p.x, y: p.tx.price })));
      if (fit) {
        const xsArr = pts.map(p => p.x);
        const xMin = Math.min(...xsArr), xMax = Math.max(...xsArr);
        const pStart = fit.intercept + fit.slope * xMin;
        const pEnd = fit.intercept + fit.slope * xMax;
        const pct = pStart > 0 ? (pEnd - pStart) / pStart * 100 : 0;
        const cls = Math.abs(pct) < 3 ? 'flat' : pct > 0 ? 'up' : 'down';
        s.trend = { pct, cls, label: cls === 'flat' ? '횡보' : cls === 'up' ? '상승세' : '하락세' };
        trendLines.push(`<line class="trend-line" x1="${xMin.toFixed(1)}" y1="${priceToY(pStart).toFixed(1)}" x2="${xMax.toFixed(1)}" y2="${priceToY(pEnd).toFixed(1)}" stroke="${c.line}" stroke-width="2.4" stroke-dasharray="0.1,7" stroke-linecap="round" filter="url(#trendGlow)"/>`);
      }
    }

    // 최고가 포인트 찾기
    const maxPt = pts.reduce((best, p) => p.tx.price > best.tx.price ? p : best, pts[0]);

    pts.forEach(p => {
      const isMax = p === maxPt;
      // 거래 점 강조: 라인은 얇게, 점은 크고 또렷하게(배경색 링으로 분리)
      dots.push(`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}"
        r="${isMax ? 4.5 : pts.length===1 ? 4 : 3}"
        fill="${c.line}" stroke="${isMax ? '#fff' : '#070b14'}" stroke-width="${isMax ? 2 : 1.5}"
        class="chart-dot" data-series="${si}" data-idx="${pts.indexOf(p)}"/>`);
    });

    // 최고가 라벨: 그래프 영역 완전 밖 상단에 고정 배치
    const lx = maxPt.x;
    const ly = maxPt.y;
    const labelText = formatPrice(maxPt.tx.price);
    // 라벨: [아파트명 : 최고 25억] 형태
    const labelText2 = formatPrice(maxPt.tx.price);
    const aptShort = escapeHtml(s.apt?.aptName || '');
    const labelTag = series.length > 1
      ? `${aptShort} : 최고 ${labelText2}`
      : `최고 ${labelText2}`;
    // 한국어 포함 → 글자당 약 8.5px
    const labelW = Math.min(labelTag.length * 8.5 + 16, 200);
    // X 경계 안에 맞추기
    const rawLX = lx - labelW / 2;
    const clampedLX = Math.max(pad.l, Math.min(W - pad.r - labelW, rawLX));
    // Y: 항상 그래프 상단(pad.t) 위에 고정 — 시리즈별로 12px씩 내려서 겹침 방지
    const labelBandY = -28 - (si * 20);

    maxLabels.push(`
      <g>
        <!-- 최고가 포인트 → 상단 라벨로 이어지는 점선 -->
        <line x1="${lx.toFixed(1)}" y1="${ly.toFixed(1)}"
              x2="${lx.toFixed(1)}" y2="${pad.t}"
              stroke="${c.line}" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>
        <!-- 라벨 배경 -->
        <rect x="${clampedLX.toFixed(1)}" y="${(pad.t + labelBandY - 2).toFixed(1)}"
              width="${labelW}" height="18" rx="5"
              fill="${c.line}" opacity="0.18"/>
        <rect x="${clampedLX.toFixed(1)}" y="${(pad.t + labelBandY - 2).toFixed(1)}"
              width="${labelW}" height="18" rx="5"
              fill="none" stroke="${c.line}" stroke-width="1" opacity="0.6"/>
        <!-- 라벨 텍스트 -->
        <text x="${(clampedLX + labelW/2).toFixed(1)}" y="${(pad.t + labelBandY + 11).toFixed(1)}"
              text-anchor="middle" fill="${c.line}"
              font-size="10" font-family="IBM Plex Mono" font-weight="700"
              letter-spacing="0.3">${labelTag}</text>
      </g>`);
  });

  // 예산 수평선
  let budgetLineEl = '';
  const budgetChk = document.getElementById('budget-check');
  const budgetVal = parseFloat(document.getElementById('budget-input')?.value);
  if (budgetChk?.checked && !isNaN(budgetVal) && budgetVal > 0) {
    const budgetManwon = budgetVal * 10000;
    const rawBy = priceToY(budgetManwon);
    // 범위 밖이면 숨기지 말고 가장자리로 클램프 + ▲(위)/▼(아래) 표시
    const off = rawBy < pad.t ? '▲' : rawBy > pad.t + ch ? '▼' : '';
    const by = Math.max(pad.t, Math.min(pad.t + ch, rawBy));
    budgetLineEl = `
      <line x1="${pad.l}" y1="${by.toFixed(1)}" x2="${(W-pad.r).toFixed(1)}" y2="${by.toFixed(1)}"
        stroke="#e8b84b" stroke-width="1.5" stroke-dasharray="8,4" opacity="${off ? '0.45' : '0.8'}"/>
      <rect x="${(W-pad.r+4).toFixed(1)}" y="${(by-9).toFixed(1)}" width="48" height="18" rx="4"
        fill="#e8b84b" opacity="0.15"/>
      <rect x="${(W-pad.r+4).toFixed(1)}" y="${(by-9).toFixed(1)}" width="48" height="18" rx="4"
        fill="none" stroke="#e8b84b" stroke-width="1" opacity="0.6"/>
      <text x="${(W-pad.r+28).toFixed(1)}" y="${(by+4).toFixed(1)}"
        text-anchor="middle" fill="#e8b84b" font-size="9" font-family="IBM Plex Mono" font-weight="700">
        ${off}${budgetVal}억
      </text>`;
  }

  // crosshair용 데이터 전역 저장
  window._chartData = {
    padL: pad.l, padT: pad.t, ch, W,
    series: series.map(s => ({
      label: s.label,
      color: s.color.line,
      pts: s.txs.map(tx => ({
        x: dateToX(tx, cw, pad.l),
        price: tx.price,
        floor: tx.floor,
        date: fmtDate(tx.year, tx.month, tx.day),
      }))
    }))
  };

  wrap.innerHTML = `
    <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;display:block">
      <defs>${defs.join('')}<filter id="trendGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      ${gridLines}
      ${xAxisLabels.join('')}
      <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${(pad.t+ch).toFixed(1)}" stroke="#2a3550" stroke-width="1"/>
      <line x1="${pad.l}" y1="${(pad.t+ch).toFixed(1)}" x2="${(W-pad.r).toFixed(1)}" y2="${(pad.t+ch).toFixed(1)}" stroke="#2a3550" stroke-width="1"/>
      ${paths.join('')}
      ${trendLines.join('')}
      ${dots.join('')}
      ${maxLabels.join('')}
      ${budgetLineEl}
      <!-- crosshair 수직선 -->
      <line id="chart-crosshair-line" x1="0" y1="${pad.t}" x2="0" y2="${(pad.t+ch).toFixed(1)}"
        stroke="#ffffff" stroke-width="1" stroke-dasharray="4,3" opacity="0"
        style="pointer-events:none;transition:opacity .1s"/>
      <!-- 마우스 오버레이 (전체 차트 영역) -->
      <rect x="${pad.l}" y="${pad.t}" width="${cw}" height="${ch}"
        fill="transparent" id="chart-overlay"
        onmousemove="onChartMouseMove(event)"
        onmouseleave="onChartMouseLeave()"/>
    </svg>
    <div id="chart-crosshair-tip" style="position:fixed;display:none;background:#0e1320;border:1px solid #2a3550;border-radius:10px;padding:10px 14px;font-size:12px;color:#e2e8f0;pointer-events:none;z-index:999;font-family:'Noto Sans KR',sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.6);min-width:160px;"></div>
    <div id="chart-tooltip" style="display:none"></div>`;

  // 레전드 렌더 (색상 + 아파트명만)
  legendBar.innerHTML = series
    .filter(s => s.apt)
    .map(s => `
      <div class="chart-legend-item">
        <span class="chart-legend-dot" style="background:${s.color.line};${s.dashed ? 'outline:2px dashed '+s.color.line+';background:transparent;outline-offset:-2px' : ''}"></span>
        <span style="${s.dashed ? 'opacity:0.8' : ''}">${s.label}</span>
        ${s.trend ? `<span class="trend-tag ${s.trend.cls}">${s.trend.label} ${s.trend.pct>=0?'+':''}${s.trend.pct.toFixed(0)}%</span>` : ''}
        ${!s.txs.length ? '<span style="font-size:10px;color:var(--muted);font-weight:400">(거래없음)</span>' : ''}
      </div>`).join('');

  // 거래 목록 렌더
  renderTxList(series);
}

function renderTxList(series) {
  const body = document.getElementById('tx-list-body');
  const countEl = document.getElementById('tx-list-count');
  if (!body) return;

  // 전체 거래 합산 (label 포함), 날짜 내림차순
  const allItems = series.flatMap(s =>
    s.txs.map(tx => ({ tx, color: s.color, label: s.label }))
  ).sort((a, b) =>
    `${b.tx.year}${b.tx.month}${b.tx.day}`.localeCompare(`${a.tx.year}${a.tx.month}${a.tx.day}`)
  );

  const isMulti = series.filter(s => s.txs.length > 0).length > 1;
  countEl.textContent = `총 ${allItems.length}건`;

  if (!allItems.length) {
    body.innerHTML = '<div style="padding:24px;text-align:center;font-size:13px;color:var(--muted)">선택한 기간 내 거래 내역 없음</div>';
    return;
  }

  body.innerHTML = allItems.map(({ tx, color, label }) => `
    <div class="tx-item">
      <div class="tx-item-bar" style="background:${isMulti ? color.line : 'transparent'}"></div>
      <div class="tx-item-info">
        <div class="tx-item-name" style="color:${isMulti ? color.line : 'var(--text)'}">
          ${isMulti ? label : `${tx.floor}층${floorBadge(tx.floor)}`}
        </div>
        <div class="tx-item-meta">${fmtDate(tx.year, tx.month, tx.day)}${isMulti?` · ${tx.floor}층${floorBadge(tx.floor)}`:''}</div>
      </div>
      <div class="tx-item-price" style="color:${isMulti ? color.line : 'var(--text)'}">
        ${formatPrice(tx.price)}
      </div>
    </div>`).join('');
}

function showChartTooltip() {} // 기존 호환용
function hideChartTooltip() {}

function onChartMouseMove(e) {
  const cd = window._chartData;
  if(!cd) return;

  const overlay = document.getElementById('chart-overlay');
  if(!overlay) return;
  const svgRect = overlay.closest('svg').getBoundingClientRect();
  // SVG viewBox 스케일 보정
  const svgEl = overlay.closest('svg');
  const scaleX = cd.W / svgRect.width;
  const mouseX = (e.clientX - svgRect.left) * scaleX;

  // crosshair 선
  const line = document.getElementById('chart-crosshair-line');
  if(line){ line.setAttribute('x1', mouseX); line.setAttribute('x2', mouseX); line.setAttribute('opacity','0.5'); }

  const tip = document.getElementById('chart-crosshair-tip');
  if(!tip) return;

  const SNAP = 30;
  const rows = [];
  let closestDate = '';
  let closestDist = Infinity;

  cd.series.forEach(s => {
    if(!s.pts.length) return;
    let best = null, bestDist = Infinity;
    s.pts.forEach(pt => {
      const d = Math.abs(pt.x - mouseX);
      if(d < bestDist){ bestDist = d; best = pt; }
    });
    if(best && bestDist < SNAP){
      rows.push({ color: s.color, label: s.label, price: best.price, date: best.date, dist: bestDist });
      if(bestDist < closestDist){ closestDist = bestDist; closestDate = best.date; }
    }
  });

  if(!rows.length){ tip.style.display='none'; return; }

  // 가격 내림차순 정렬
  rows.sort((a,b) => b.price - a.price);

  tip.innerHTML = '<div style="font-size:10px;color:#4a5568;margin-bottom:7px;font-family:IBM Plex Mono,monospace">' + closestDate + '</div>'
    + rows.map((r, i) => '<div style="display:flex;align-items:center;gap:8px;padding:3px 0;' + (i < rows.length-1 ? 'border-bottom:1px solid #1a2235' : '') + '">'
      + '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + r.color + ';flex-shrink:0"></span>'
      + '<span style="flex:1;font-size:11px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px">' + r.label + '</span>'
      + '<span style="font-family:IBM Plex Mono,monospace;font-size:12px;font-weight:700;color:#e2e8f0;margin-left:8px">' + formatPrice(r.price) + '</span>'
      + '</div>').join('');

  tip.style.display = 'block';
  const tipX = e.clientX + 16;
  const tipY = e.clientY - tip.offsetHeight / 2;
  tip.style.left = Math.min(tipX, window.innerWidth - tip.offsetWidth - 10) + 'px';
  tip.style.top = Math.max(10, tipY) + 'px';
}

function onChartMouseLeave() {
  const line = document.getElementById('chart-crosshair-line');
  if(line) line.setAttribute('opacity','0');
  const tip = document.getElementById('chart-crosshair-tip');
  if(tip) tip.style.display = 'none';
}

function markRead(aptId) {
  if (!newCounts[aptId]) return;
  newCounts[aptId] = 0;
  const allTxs = Object.values(transactions[aptId] || {}).flat();
  lastSeen[aptId] = new Set(allTxs.map(t => t.id));
  saveSeen();
  renderGrid();   // 배지 갱신 (선택 하이라이트는 selectedAptIds 로 재적용됨)
}

function removeApt(aptId) {
  apartments=apartments.filter(a=>a.id!==aptId);delete transactions[aptId];delete newCounts[aptId];delete lastSeen[aptId];
  // 상세 시트가 이 아파트로 열려 있으면 닫기(삭제 후 빈/오래된 내용 방지)
  if(detailAptId===aptId){ detailAptId=null; closeModal('detail-sheet'); }
  const hadSel = selectedAptIds.some(s => s.aptId === aptId);
  selectedAptIds = selectedAptIds.filter(s => s.aptId !== aptId);
  if(hadSel){
    document.querySelectorAll('.apt-card').forEach(c=>c.classList.remove('selected-a','selected-b','selected-c','selected-d','selected-e'));
    selectedAptIds.forEach((s,i)=>{
      const card=document.getElementById(`card-${s.aptId}-${s.pyeong}`);
      if(card) card.classList.add(CHART_COLORS[i].cls);
    });
    if(!selectedAptIds.length){
      document.getElementById('chart-empty').style.display='flex';
      document.getElementById('chart-content').style.display='none';
    } else {
      renderChart();
    }
  }
  saveApts();saveSeen();renderGrid();
}

function openDetail(aptId){
  const apt=apartments.find(a=>a.id===aptId);if(!apt)return;
  detailAptId=aptId;
  if((newCounts[aptId]||0)>0){
    newCounts[aptId]=0;
    const allTxs=Object.values(transactions[aptId]||{}).flat();
    lastSeen[aptId]=new Set(allTxs.map(t=>t.id));saveSeen();renderGrid();
  }
  document.getElementById('sheet-title').textContent=apt.aptName;
  document.getElementById('sheet-sub').textContent=`${apt.regionName}${apt.dong?' '+apt.dong:''} · 최근 ${periodLabel(currentPeriod)} 실거래`;
  document.getElementById('detail-tabs').innerHTML=apt.pyeongs.map(p=>
    `<button class="detail-tab${p===apt.pyeongs[0]?' active':''}" onclick="switchDetailTab('${p}',this)">${PYEONG_DEFS[p].label}</button>`
  ).join('');
  detailActivePyeong=apt.pyeongs[0];
  renderDetailBody(aptId,detailActivePyeong);
  openModal('detail-sheet');
}
function switchDetailTab(p,btn){
  document.querySelectorAll('.detail-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');detailActivePyeong=p;renderDetailBody(detailAptId,p);
}
function renderDetailBody(aptId,p){
  const apt=apartments.find(a=>a.id===aptId);
  const txs=(transactions[aptId]||{})[p]||[];
  const body=document.getElementById('sheet-body');
  if(!txs.length){body.innerHTML='<div class="tx-no">조회된 거래 내역이 없습니다</div>';return;}

  // ── 요약 지표 블록 (타이밍 + 지역평균) ──
  const s=calcStats(txs);
  const fh=Math.round(s.fromHigh);
  const rAvg=apt?((regionAvg[apt.lawdCd]||{})[p]||0):0;
  const aptAvg=avgPyeongPrice(txs);
  const regionDiff=(rAvg>0&&aptAvg>0)?Math.round((aptAvg-rAvg)/rAvg*100):null;
  const hilo=(s.isHigh&&txs.length>=2)?'<span class="hilo-badge hi">신고가</span>'
    :(s.isLow&&txs.length>=2)?'<span class="hilo-badge lo">신저가</span>':'';
  const dMAgo=monthsSince(s.latest.year, s.latest.month);
  const dStale=dMAgo>=6?`<span class="stale-tag">${agoLabel(dMAgo)}</span>`:'';
  const summary=`<div class="detail-summary">
    <div class="ds-item"><div class="ds-k">최근 실거래 ${dStale}</div><div class="ds-v">${formatPrice(s.latest.price)} ${hilo}</div></div>
    <div class="ds-item"><div class="ds-k">기간 고점 / 저점</div><div class="ds-v">${formatPrice(s.maxPrice)} <span class="ds-sub">/ ${formatPrice(s.minPrice)}</span></div></div>
    <div class="ds-item"><div class="ds-k">고점 대비</div><div class="ds-v ${fh<0?'down-color':'neu-color'}">${fh}%</div></div>
    <div class="ds-item"><div class="ds-k">거래량</div><div class="ds-v">${s.count}건</div></div>
    ${regionDiff!==null?`<div class="ds-item" style="grid-column:1/-1"><div class="ds-k">지역평균 대비 (평단가)</div><div class="ds-v ${regionDiff>=0?'up-color':'down-color'}">${regionDiff>=0?'+':''}${regionDiff}% <span class="ds-sub">${aptAvg.toLocaleString()} vs 지역 ${rAvg.toLocaleString()}만/평</span></div></div>`:''}
  </div>`;

  const rows=txs.map((tx,i)=>{
    const prev=txs[i+1];const diff=prev?tx.price-prev.price:null;
    // 카드와 동일 규칙: 상승=up(초록)/하락=down(빨강)
    const dh=diff!==null?`<div class="tx-diff ${diff>0?'up-color':diff<0?'down-color':'neu-color'}">${diff>0?'▲':diff<0?'▼':'─'} ${formatPrice(Math.abs(diff))}</div>`:'';
    return `<div class="tx-row"><div><div class="tx-date">${fmtDate(tx.year,tx.month,tx.day)} · ${tx.floor}층${floorBadge(tx.floor)}</div><div class="tx-detail">${pyeongStr(tx.area)}</div></div><div><div class="tx-price">${formatPrice(tx.price)}</div>${dh}</div></div>`;
  }).join('');
  body.innerHTML=summary+rows;
}

function openModal(id){const el=document.getElementById(id);el.style.display='flex';requestAnimationFrame(()=>el.classList.add('show'));}
function closeModal(id){const el=document.getElementById(id);el.classList.remove('show');setTimeout(()=>{el.style.display='none';},220);}
// 백드롭에서 '눌러서(mousedown) 뗀(click)' 경우에만 닫기.
// (모달 안에서 드래그하다 커서가 백드롭으로 나가며 뗄 때 닫히던 문제 방지)
let backdropDownTarget=null;
function onBackdropDown(e){ backdropDownTarget=e.target; }
function backdropClose(e,id){
  if(e.target===e.currentTarget && backdropDownTarget===e.currentTarget) closeModal(id);
  backdropDownTarget=null;
}
// ESC 로 열린 모달/시트 닫기
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  ['add-modal','detail-sheet'].forEach(id => {
    const el = document.getElementById(id);
    if(el && el.classList.contains('show')) closeModal(id);
  });
});

(function init(){
  loadStorage();
  // 시/도 셀렉트 초기화
  const cityEl = document.getElementById('city-select');
  if(cityEl){
    cityEl.innerHTML = CITIES.map(c => `<option value="${c}">${c}</option>`).join('');
    // 서울 기본 선택
    cityEl.value = '서울특별시';
    updateGuSelect('서울특별시');
  }
  document.getElementById('add-modal').style.display='none';
  document.getElementById('detail-sheet').style.display='none';
  renderGrid();
  // 카드 밀도 복원 (기본=컴팩트)
  let density='compact';
  try{ density=localStorage.getItem('apt_density')||'compact'; }catch(e){}
  setDensity(density);
  if(apartments.length>0) refreshAll();
})();
