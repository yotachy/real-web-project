<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>실거래가 모니터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070b14;--card:#0e1320;--card2:#0b0f1c;--border:#1a2235;--border2:#2a3550;--accent:#e8b84b;--accent-dim:rgba(232,184,75,0.15);--text:#e2e8f0;--muted:#4a5568;--muted2:#718096;--up:#34d399;--down:#f87171;--blue:#60a5fa;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;overflow-x:hidden;}
  ::-webkit-scrollbar{width:5px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
  #dashboard-screen{padding:20px 24px 60px;max-width:1600px;margin:0 auto;}
  /* 헤더 */
  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-top:4px;}
  .header-title{font-size:20px;font-weight:900;}.header-title span{color:var(--accent);}
  .header-sub{font-size:11px;color:var(--muted);margin-top:3px;}
  /* 좌측 카드 컬럼 (툴바 + 스크롤 목록, 고정) */
  .cards-col{grid-area:cards;min-width:0;position:sticky;top:16px;max-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:10px;}
  .cards-toolbar{display:flex;align-items:center;justify-content:space-between;padding:0 2px;flex-shrink:0;}
  .cards-toolbar-title{font-size:12px;font-weight:800;color:var(--text);letter-spacing:.3px;}
  .density-toggle{display:inline-flex;gap:2px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:2px;}
  .density-btn{background:none;border:none;color:var(--muted2);font-size:11px;font-weight:700;padding:4px 11px;border-radius:6px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
  .density-btn.active{background:var(--accent);color:#000;}
  /* 평형 그룹 카드 목록 (세로 리스트) */
  .pyeong-groups{min-width:0;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:18px;padding-right:3px;}
  .pyeong-groups::-webkit-scrollbar{width:5px;}
  .pyeong-groups::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
  /* 밀도: 기본=컴팩트(상세부 숨김·타이트), 상세=전체 */
  .card-detail{display:none;}
  .pyeong-groups.detail .card-detail{display:block;}
  .pyeong-groups.detail .pyeong-group-cards{gap:8px;}
  .pyeong-groups.detail .apt-card{padding:12px 14px;}
  .pyeong-groups.detail .card-head{margin-bottom:8px;}
  .pyeong-group{display:flex;flex-direction:column;gap:8px;}
  /* 스티키 섹션 헤더: 스크롤해도 상단 고정 + 액센트 바·구분선으로 그룹 명확 */
  .pyeong-group-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--text);letter-spacing:.3px;padding:7px 4px;background:var(--bg);border-bottom:1px solid var(--border2);}
  .pyeong-group-head::before{content:'';width:3px;height:14px;border-radius:2px;background:var(--accent);flex-shrink:0;}
  .pyeong-group-head .pg-count{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:var(--muted2);background:var(--card2);border:1px solid var(--border);border-radius:99px;padding:1px 7px;margin-left:2px;}
  .pyeong-group-cards{display:flex;flex-direction:column;gap:6px;}
  /* 아파트 카드 (세로 리스트, 세련) */
  .apt-card{position:relative;width:100%;background:linear-gradient(180deg,#0e1727,#0b1120);border:1px solid var(--border);border-radius:12px;cursor:pointer;padding:9px 12px;animation:fadeUp .3s ease both;transition:border-color .18s,transform .12s,box-shadow .18s;}
  .apt-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.4);}
  .apt-card:active{transform:translateY(0);}
  /* 메인 2단 레이아웃 */
  /* 좌: 카드 사이드바(고정 스크롤) / 우: 차트(hero, 넓게·고정) */
  .main-layout{display:grid;grid-template-columns:minmax(300px,360px) 1fr;grid-template-areas:"cards chart";gap:18px;align-items:start;}
  /* 우측 차트 패널 */
  .chart-panel{grid-area:chart;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:16px;position:sticky;top:16px;min-height:560px;display:flex;flex-direction:column;}
  .chart-panel-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:var(--muted);gap:12px;}
  .chart-panel-empty-icon{font-size:40px;}
  .chart-header{padding:18px 20px 14px;border-bottom:1px solid var(--border);}
  .chart-apt-name{font-size:16px;font-weight:700;}
  .chart-apt-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .chart-tabs{display:flex;gap:6px;padding:14px 20px 0;overflow-x:auto;}
  .chart-tab{background:none;border:1.5px solid var(--border);color:var(--muted2);padding:4px 13px;border-radius:99px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;transition:all .15s;}
  .chart-tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  .chart-body{padding:16px 20px 20px;flex:1;display:flex;flex-direction:column;}
  .chart-svg-wrap{flex:1;min-height:420px;}
  .chart-legend{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;}
  .chart-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted2);}
  .chart-legend-dot{width:8px;height:8px;border-radius:50%;}
  .chart-legend-bar{display:flex;gap:14px;flex-wrap:wrap;padding:10px 0 2px;align-items:center;}
  .chart-legend-item{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--text);}
  .chart-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  /* 카드 선택 상태 */
  .apt-card.selected-a{border-color:#e8b84b !important;box-shadow:0 0 0 1px #e8b84b,0 6px 20px rgba(232,184,75,.16);}
  .apt-card.selected-b{border-color:#60a5fa !important;box-shadow:0 0 0 1px #60a5fa,0 6px 20px rgba(96,165,250,.16);}
  .apt-card.selected-c{border-color:#a78bfa !important;box-shadow:0 0 0 1px #a78bfa,0 6px 20px rgba(167,139,250,.16);}
  .apt-card.selected-d{border-color:#34d399 !important;box-shadow:0 0 0 1px #34d399,0 6px 20px rgba(52,211,153,.16);}
  .apt-card.selected-e{border-color:#fb923c !important;box-shadow:0 0 0 1px #fb923c,0 6px 20px rgba(251,146,60,.16);}
  .apt-card.selected-a .card-apt-name::before{content:'① ';color:#e8b84b;}
  .apt-card.selected-b .card-apt-name::before{content:'② ';color:#60a5fa;}
  .apt-card.selected-c .card-apt-name::before{content:'③ ';color:#a78bfa;}
  .apt-card.selected-d .card-apt-name::before{content:'④ ';color:#34d399;}
  .apt-card.selected-e .card-apt-name::before{content:'⑤ ';color:#fb923c;}
  .compare-hint{font-size:11px;color:var(--muted);text-align:center;padding:6px 0 10px;display:none;}
  .color-dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
  @media(max-width:900px){.main-layout{grid-template-columns:1fr;grid-template-areas:"cards" "chart";}.cards-col{position:static;max-height:none;}.pyeong-groups{overflow:visible;}.pyeong-group-head{position:static;}.chart-panel{position:static;min-height:360px;}}
  /* 카드 헤더/바디 */
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;}
  .card-apt-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;}
  .card-apt-region{font-size:10px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .card-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px;transition:color .15s;flex-shrink:0;}
  .card-remove:hover{color:var(--down);}
  .card-region{display:none;}
  /* 카드 가격 */
  .card-price-row{display:flex;align-items:baseline;gap:5px;margin-top:5px;flex-wrap:wrap;}
  .card-price-row-prev{margin-top:3px;}
  .card-price-label{font-size:9px;font-weight:700;color:var(--accent);flex-shrink:0;width:22px;}
  .card-price-label.muted{color:var(--muted);}
  .card-price-main{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:800;letter-spacing:-0.5px;line-height:1;}
  .card-price-prev-val{display:flex;align-items:center;gap:4px;}
  .card-price-prev-val span:first-child{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600;color:var(--text);}

  .card-chg{display:inline-flex;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;padding:1px 5px;border-radius:99px;}
  .card-chg.up{background:rgba(52,211,153,0.15);color:#34d399;}
  .card-chg.down{background:rgba(248,113,113,0.15);color:#f87171;}
  .card-chg.neu{background:rgba(113,128,150,0.12);color:#718096;}
  .card-badge{position:absolute;top:6px;right:24px;font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--accent-dim);color:var(--accent);border:1px solid rgba(232,184,75,.4);animation:pulse 2s infinite;}
  /* 선택 상태 */
  /* 카드 가격 영역 */
  .price-block{padding:4px 0 8px;}
  .price-main{font-family:'IBM Plex Mono',monospace;font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.1;color:var(--text);}
  .price-sub-row{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap;}
  .price-prev{font-size:12px;color:var(--muted2);}
  .price-prev span{font-family:'IBM Plex Mono',monospace;font-weight:600;}
  .chg-badge{display:inline-flex;align-items:center;gap:2px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;}
  .chg-badge.up{background:rgba(52,211,153,0.15);color:#34d399;}
  .chg-badge.down{background:rgba(248,113,113,0.15);color:#f87171;}
  .chg-badge.neu{background:rgba(113,128,150,0.12);color:#718096;}
  .price-meta{font-size:10px;color:var(--muted);margin-top:4px;}
  .range-row{display:flex;gap:4px;margin-top:8px;}
  .range-pill{flex:1;background:var(--card2);border-radius:7px;padding:5px 8px;text-align:center;}
  .range-pill-label{font-size:9px;color:var(--muted);margin-bottom:2px;}
  .range-pill-val{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;}
  .stat-box{background:var(--card2);border-radius:8px;padding:8px 12px;margin-top:10px;display:flex;justify-content:space-between;}
  .stat-item{text-align:center;}
  .stat-label{font-size:10px;color:var(--muted);margin-bottom:3px;}
  .stat-val{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
  .no-data{font-size:12px;color:var(--muted);padding:8px 0;}
  .btn-primary{background:var(--accent);color:#0a0a0a;border:none;padding:11px 22px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:opacity .15s;width:100%;}
  .btn-primary:hover{opacity:.88;}
  .btn-ghost{background:transparent;color:var(--muted2);border:1px solid var(--border);padding:9px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;white-space:nowrap;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn-ghost:disabled{opacity:.5;cursor:not-allowed;}
  .pyeong-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .pyeong-btn{
    background:#0d1422;border:1.5px solid var(--border);color:var(--muted);
    padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;
    font-family:'Noto Sans KR',sans-serif;transition:all .15s;
    position:relative;
  }
  .pyeong-btn:hover:not([style*="none"]){border-color:var(--border2);color:var(--muted2);}
  .pyeong-btn.active{
    background:var(--accent);border-color:var(--accent);
    color:#000;font-weight:700;
    box-shadow:0 2px 10px rgba(232,184,75,0.35);
  }
  .pyeong-btn.active::after{
    content:'✓';margin-left:5px;font-size:12px;
  }
  .pyeong-hint{font-size:11px;color:var(--muted);margin-top:8px;}
  .btn-add{background:var(--accent);color:#000;border:none;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:opacity .15s;display:flex;align-items:center;gap:6px;white-space:nowrap;}
  .btn-add:hover{opacity:.88;}
  .form-label{font-size:12px;color:var(--muted);display:block;margin-bottom:8px;}
  .form-label .req{color:var(--down);}
  .form-group{margin-bottom:18px;}
  input[type=text],select{background:#07090f;border:1px solid var(--border);color:var(--text);padding:11px 14px;border-radius:9px;font-size:14px;font-family:'Noto Sans KR',sans-serif;outline:none;transition:border-color .15s;width:100%;}
  input[type=text]:focus,select:focus{border-color:var(--accent);}
  input::placeholder{color:var(--muted);}
  .form-hint{font-size:11px;color:var(--muted);margin-top:5px;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;opacity:0;transition:opacity .2s;}
  .modal-backdrop.show{opacity:1;}
  .modal-box{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:440px;padding:28px;animation:fadeUp .25s ease;}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .modal-title{font-size:18px;font-weight:700;}
  .modal-close{background:none;border:none;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;transition:color .15s;}
  .modal-close:hover{color:var(--text);}
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:200;opacity:0;transition:opacity .2s;padding:16px;}
  .sheet-backdrop.show{opacity:1;}
  .sheet-box{background:var(--card);border:1px solid var(--border);border-radius:18px;width:100%;max-width:720px;max-height:88vh;display:flex;flex-direction:column;transform:translateY(20px);transition:transform .25s ease;}
  .sheet-backdrop.show .sheet-box{transform:translateY(0);}
  .sheet-head{padding:20px 24px 0;border-bottom:1px solid var(--border);flex-shrink:0;}
  .sheet-head-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;}
  .sheet-title{font-size:17px;font-weight:700;}
  .sheet-sub{font-size:12px;color:var(--muted);margin-top:3px;}
  .sheet-body{overflow-y:auto;flex:1;min-height:0;padding:4px 24px 32px;}
  .detail-tabs{display:flex;gap:8px;padding:12px 0;overflow-x:auto;}
  .detail-tab{background:none;border:1.5px solid var(--border);color:var(--muted2);padding:5px 14px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;transition:all .15s;}
  .detail-tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  .tx-row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--border);}
  .tx-row:last-child{border-bottom:none;}
  .tx-date{font-size:13px;color:var(--muted2);}
  .tx-detail{font-size:12px;color:var(--muted);margin-top:2px;}
  .tx-price{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;text-align:right;}
  .tx-diff{font-family:'IBM Plex Mono',monospace;font-size:11px;margin-top:2px;text-align:right;}
  .tx-no{color:var(--muted);text-align:center;padding:40px 0;font-size:13px;line-height:1.7;}
  .tx-no b{color:var(--text);font-weight:700;}
  .state-empty{text-align:center;padding:80px 20px;color:var(--muted);}
  .card-loading{text-align:center;padding:28px 0;color:var(--muted);font-size:13px;}
  .spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle;}
  .up-color{color:var(--up);}.down-color{color:var(--down);}.neu-color{color:var(--muted2);}
  #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a2235;border:1px solid var(--border2);color:var(--text);padding:10px 20px;border-radius:99px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
  #toast.show{opacity:1;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
  select option{background:#0e1320;}
  .apt-select-item{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .15s;background:#0a0f1c;}
  .apt-select-item:hover{border-color:var(--accent);background:var(--accent-dim);}
  .apt-select-item:last-child{margin-bottom:0;}
  .apt-select-name{font-size:14px;font-weight:600;}
  .apt-select-count{font-size:12px;color:var(--muted);}
  .autocomplete-wrap{position:relative;}
  .autocomplete-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#0e1320;border:1px solid var(--border2);border-radius:10px;z-index:300;max-height:220px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.5);}
  .autocomplete-item{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--border);}
  .autocomplete-item:last-child{border-bottom:none;}
  .autocomplete-item:hover,.autocomplete-item.focused{background:var(--accent-dim);}
  .autocomplete-item-name{font-size:13px;font-weight:600;color:var(--text);}
  .autocomplete-item-count{font-size:11px;color:var(--muted);margin-left:8px;flex-shrink:0;}
  .autocomplete-searching{padding:12px 14px;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .period-btns{display:flex;gap:6px;}
  .period-btn{background:transparent;border:1.5px solid var(--border);color:var(--muted2);padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
  .period-btn:hover{border-color:var(--border2);color:var(--text);}
  .period-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  /* 거래 목록 */
  .tx-list-wrap{border-top:1px solid var(--border);flex-shrink:0;display:flex;flex-direction:column;max-height:280px;}
  .tx-list-header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;}
  .tx-list-title{font-size:12px;font-weight:700;color:var(--muted2);}
  .tx-list-count{font-size:11px;color:var(--muted);}
  .tx-list-body{overflow-y:auto;flex:1;}
  .tx-list-body::-webkit-scrollbar{width:4px;}
  .tx-list-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
  .tx-item{display:grid;grid-template-columns:3px 1fr auto;gap:0 12px;align-items:center;padding:8px 20px;border-bottom:1px solid var(--border);transition:background .1s;}
  .tx-item:last-child{border-bottom:none;}
  .tx-item:hover{background:#0b1018;}
  .tx-item-bar{width:3px;height:32px;border-radius:2px;flex-shrink:0;}
  .tx-item-info{min-width:0;}
  .tx-item-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-item-meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .tx-item-price{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;text-align:right;white-space:nowrap;}
  /* 예산 입력 */
  .budget-wrap{display:flex;align-items:center;gap:7px;background:#0a0f1c;border:1.5px solid var(--border);border-radius:9px;padding:5px 12px;transition:border-color .15s;}
  .budget-wrap:focus-within{border-color:var(--accent);}
  .budget-wrap.active{border-color:var(--accent);background:var(--accent-dim);}
  .budget-check{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
  .budget-label{font-size:12px;color:var(--muted2);white-space:nowrap;}
  .budget-input{background:transparent;border:none;outline:none;font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--text);width:60px;text-align:right;}
  .budget-input::placeholder{color:var(--muted);font-weight:400;}
  .budget-unit{font-size:12px;color:var(--muted2);}
  /* 스파크라인 */
  .card-sparkline{margin-top:8px;height:32px;width:100%;}
  /* 카드 날짜/층수 크기 업 */
  .card-price-date{font-size:11px;font-weight:500;color:var(--muted2);flex-shrink:0;}
  .card-price-row>.card-price-date{margin-left:auto;}
  .card-price-date.muted{font-size:11px;font-weight:500;color:var(--muted);}
  @media(max-width:480px){#dashboard-screen{padding:16px 12px 80px;}.header-title{font-size:17px;}.period-btn{padding:6px 10px;font-size:12px;}}
  /* ── 보완: 카드 액션·배지·접근성·반응형 ───────────────────── */
  .card-actions{display:flex;gap:2px;flex-shrink:0;margin-left:4px;}
  .card-icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;padding:2px 5px;border-radius:5px;transition:color .15s,background .15s;}
  .card-icon-btn:hover{color:var(--text);background:rgba(255,255,255,.06);}
  .card-remove:hover{color:var(--down);}
  /* +N 배지: 절대배치 → 이름과 액션 사이 인라인 필 */
  .card-badge{position:static;flex-shrink:0;align-self:center;animation:pulse 2s infinite;}
  /* 타이밍·지역평균 지표 칩 */
  .card-stats{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;}
  .stat-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:2px 7px;color:var(--muted2);white-space:nowrap;}
  .stat-chip b{font-weight:600;color:var(--muted);font-size:9px;}
  .stat-chip .up-color{color:var(--up);font-weight:700;}
  .stat-chip .down-color{color:var(--down);font-weight:700;}
  .stat-chip .neu-color{color:var(--muted2);font-weight:700;}
  /* 신고가(강조=골드)·신저가(파랑) 배지 */
  .hilo-badge{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;vertical-align:middle;}
  .hilo-badge.hi{background:var(--accent-dim);color:var(--accent);border:1px solid rgba(232,184,75,.4);}
  .hilo-badge.lo{background:rgba(96,165,250,0.16);color:var(--blue);}
  /* 상세시트 요약 지표 블록 */
  .detail-summary{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:14px 0 12px;border-bottom:1px solid var(--border);margin-bottom:6px;}
  .ds-item{min-width:0;}
  .ds-k{font-size:11px;color:var(--muted);margin-bottom:3px;}
  .ds-v{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700;}
  .ds-v.up-color{color:var(--up);}.ds-v.down-color{color:var(--down);}.ds-v.neu-color{color:var(--muted2);}
  .ds-sub{font-family:'Noto Sans KR',sans-serif;font-size:10px;font-weight:400;color:var(--muted);}
  /* ── 모드 토글 + 발굴 랭킹 ── */
  .mode-toggle{display:inline-flex;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:16px;}
  .mode-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--muted2);padding:8px 16px;border-radius:7px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
  .mode-btn svg{width:15px;height:15px;flex-shrink:0;}
  .mode-btn.active{background:var(--accent);color:#000;}
  .discover-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
  .disc-select{width:auto;min-width:108px;padding:9px 12px;}
  .disc-pyeong{display:flex;gap:5px;flex-wrap:wrap;}
  .disc-pyeong-btn{background:#0d1422;border:1.5px solid var(--border);color:var(--muted2);padding:8px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;}
  .disc-pyeong-btn.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);}
  .discover-note{font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.5;}
  .disc-row{display:grid;grid-template-columns:32px 1fr auto auto;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
  .disc-rank{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:800;color:var(--muted2);text-align:center;}
  .disc-main{min-width:0;}
  .disc-name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .disc-meta{font-size:11px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  /* 정렬 기준 강조 지표 (오른쪽 큰 값 + 라벨) */
  .disc-metric{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap;}
  .disc-metric-val{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:800;line-height:1.1;}
  .disc-metric-val.accent-color{color:var(--accent);}
  .disc-metric-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.4px;margin-top:2px;}
  .disc-unit{font-size:10px;font-weight:600;color:var(--muted2);margin-left:1px;}
  .disc-dong,.ac-dong{font-size:11px;font-weight:500;color:var(--muted);}
  /* 저/중/고층 태그 (절대 층수 근사) — 저층 파랑·중층 회색·고층 골드 */
  .floor-tier{display:inline-block;font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;vertical-align:middle;margin-left:3px;}
  .floor-tier.low{background:rgba(96,165,250,.16);color:var(--blue);}
  .floor-tier.mid{background:rgba(148,163,184,.15);color:#94a3b8;}
  .floor-tier.high{background:var(--accent-dim);color:var(--accent);}
  /* 차트 추세선(회귀) — 데이터 라인과 구분되게 깜빡이는 점선 */
  .trend-line{animation:trendBlink 1.5s ease-in-out infinite;}
  @keyframes trendBlink{0%,100%{opacity:.22}50%{opacity:.92}}
  .trend-tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;margin-left:2px;white-space:nowrap;}
  .trend-tag.up{background:rgba(52,211,153,.16);color:var(--up);}
  .trend-tag.down{background:rgba(248,113,113,.16);color:var(--down);}
  .trend-tag.flat{background:rgba(148,163,184,.15);color:#94a3b8;}
  /* 오래된 실거래(최근가가 과거) 표시 */
  .stale-tag{font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;background:rgba(232,184,75,.14);color:var(--accent);white-space:nowrap;}
  /* 아파트 추가 모달: 크게 + 시/도·구/군 2열 + 자주선택 pill */
  .modal-box-lg{max-width:560px;}
  .form-row-2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
  .quick-pills{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:18px;}
  .quick-pills-label{font-size:11px;color:var(--muted);margin-right:2px;}
  .quick-pill{background:#0d1422;border:1.5px solid var(--border);color:var(--muted2);padding:6px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Noto Sans KR',sans-serif;transition:all .15s;white-space:nowrap;}
  .quick-pill:hover{border-color:var(--accent);color:var(--accent);}
  @media(max-width:520px){
    .form-row-2{grid-template-columns:1fr;gap:0;}
    .form-row-2 .form-group{margin-bottom:18px !important;}
    .modal-box-lg{max-width:100%;}
  }
  .disc-add{background:var(--accent);color:#000;border:none;padding:7px 12px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;white-space:nowrap;transition:opacity .15s;}
  .disc-add:hover{opacity:.88;}
  .disc-add:disabled{background:var(--card2);color:var(--muted);cursor:default;border:1px solid var(--border);}
  @media(max-width:560px){
    .disc-row{grid-template-columns:26px 1fr auto;gap:8px 10px;}
    .disc-metric{grid-column:2;grid-row:2;align-items:flex-start;flex-direction:row;gap:5px;}
    .disc-metric-lbl{margin-top:0;align-self:center;}
    .disc-add{grid-column:3;grid-row:1/3;align-self:center;}
  }
  /* 키보드 포커스 가시성 */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .apt-card:focus:not(:focus-visible),.card-icon-btn:focus:not(:focus-visible),
  .period-btn:focus:not(:focus-visible),.chart-tab:focus:not(:focus-visible){outline:none;}
  /* 모바일: 광고 패널을 차트 아래로 (order) */
  /* 사용자 모션 최소화 선호 존중 */
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
  }
</style>
</head>
<body>
<div id="dashboard-screen">
  <!-- 헤더 -->
  <div class="header">
    <div>
      <div class="header-title">실거래가 <span>모니터</span></div>

    </div>
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
      <div class="period-btns">
        <button class="period-btn" data-months="6" onclick="setPeriod(this)">6개월</button>
        <button class="period-btn" data-months="12" onclick="setPeriod(this)">1년</button>
        <button class="period-btn active" data-months="36" onclick="setPeriod(this)">3년</button>
        <button class="period-btn" data-months="60" onclick="setPeriod(this)">5년</button>
      </div>
      <div class="budget-wrap active" id="budget-wrap">
        <input type="checkbox" class="budget-check" id="budget-check" checked onchange="onBudgetChange()">
        <label class="budget-label" for="budget-check">예산</label>
        <input type="number" class="budget-input" id="budget-input" value="20" min="0" step="0.1"
          aria-label="예산 금액(억원)" oninput="onBudgetChange()" onchange="onBudgetChange()">
        <span class="budget-unit">억</span>
      </div>
      <button class="btn-add" onclick="openAddModal()">＋ 아파트 추가</button>
    </div>
  </div>

  <!-- 모드 토글: 관심목록 / 단지 검색 -->
  <div class="mode-toggle" role="tablist" aria-label="보기 모드">
    <button class="mode-btn active" data-mode="watch" role="tab" aria-selected="true" onclick="setMode('watch')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>관심목록</button>
    <button class="mode-btn" data-mode="discover" role="tab" aria-selected="false" onclick="setMode('discover')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>단지 검색</button>
  </div>

  <div id="watch-view">
  <!-- 좌: 카드(위)+광고(아래) / 우: 차트(고정) 2단 -->
  <div class="main-layout">
    <!-- 좌: 카드 사이드바 (밀도 토글 + 목록) -->
    <div class="cards-col">
      <div class="cards-toolbar">
        <span class="cards-toolbar-title">관심 단지</span>
        <div class="density-toggle" role="group" aria-label="카드 밀도">
          <button class="density-btn active" data-density="compact" onclick="setDensity('compact')">기본</button>
          <button class="density-btn" data-density="detail" onclick="setDensity('detail')">상세</button>
        </div>
      </div>
      <div class="pyeong-groups" id="pyeong-groups">
        <div style="padding:32px;text-align:center;color:var(--muted);font-size:13px;">
          + 아파트 추가 버튼으로 관심 아파트를 추가하세요
        </div>
      </div>
    </div>
    <div class="chart-panel" id="chart-panel">
      <div class="chart-panel-empty" id="chart-empty">
        <div class="chart-panel-empty-icon">📈</div>
        <p style="font-size:14px;font-weight:600">아파트를 선택하세요</p>
        <p style="font-size:12px">카드를 클릭하면 실거래 그래프가 표시돼요</p>
      </div>
      <div id="chart-content" style="display:none;flex-direction:column;flex:1;">
        <div class="chart-header">
          <div class="chart-apt-name" id="chart-apt-name">-</div>
          <div class="chart-apt-sub" id="chart-apt-sub">-</div>
        </div>
        <div class="chart-tabs" id="chart-tabs"></div>
        <div class="compare-hint" id="compare-hint">💡 다른 아파트 카드를 클릭하면 최대 5개까지 비교할 수 있어요</div>
        <div class="chart-body">
          <div class="chart-svg-wrap" id="chart-svg-wrap"></div>
          <div class="chart-legend-bar" id="chart-legend-bar"></div>
        </div>
        <div class="tx-list-wrap" id="tx-list-wrap">
          <div class="tx-list-header">
            <span class="tx-list-title">실거래 내역</span>
            <span class="tx-list-count" id="tx-list-count"></span>
          </div>
          <div class="tx-list-body" id="tx-list-body"></div>
        </div>
      </div>
    </div>
  </div>
  </div><!-- /watch-view -->

  <!-- 발굴 뷰: 구·평형·정렬 선택 → 단지 랭킹 -->
  <div id="discover-view" style="display:none">
    <div class="discover-controls">
      <select id="disc-city" class="disc-select" aria-label="시/도" onchange="onDiscCityChange()"></select>
      <select id="disc-gu" class="disc-select" aria-label="구/군" onchange="onDiscGuChange()"></select>
      <div class="disc-pyeong" id="disc-pyeong" role="group" aria-label="평형"></div>
      <select id="disc-sort" class="disc-select" aria-label="정렬" onchange="renderDiscover()">
        <option value="growth">상승률순</option>
        <option value="count">거래량순</option>
        <option value="avg">평단가순</option>
      </select>
    </div>
    <div class="discover-note" id="discover-note"></div>
    <div id="discover-results"></div>
  </div>
</div>


<!-- ADD MODAL -->
<div class="modal-backdrop" id="add-modal" onmousedown="onBackdropDown(event)" onclick="backdropClose(event,'add-modal')">
  <div class="modal-box modal-box-lg" role="dialog" aria-modal="true" aria-label="아파트 추가">
    <div class="modal-head">
      <span class="modal-title">아파트 추가</span>
      <button class="modal-close" aria-label="닫기" onclick="closeModal('add-modal')">×</button>
    </div>
    <div class="quick-pills" id="quick-region-pills"></div>
    <div class="form-row-2">
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">시 / 도 <span class="req">*</span></label>
        <select id="city-select" style="height:44px" onchange="onCityChange()"></select>
      </div>
      <div class="form-group" style="margin-bottom:0">
        <label class="form-label">구 / 군 <span class="req">*</span></label>
        <select id="region-select" style="height:44px;opacity:0.4;cursor:not-allowed;" disabled onchange="onGuChange()"></select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">아파트 이름 <span class="req">*</span></label>
      <div class="autocomplete-wrap">
        <input type="text" id="apt-name-input" placeholder="시/도와 구/군을 먼저 선택해주세요"
          oninput="onAptNameInput(this.value)"
          onkeydown="onAptNameKeydown(event)"
          onblur="setTimeout(function(){var l=document.getElementById('autocomplete-list');if(l)l.style.display='none';},150)"
          autocomplete="off" disabled
          style="opacity:0.4;cursor:not-allowed;">
        <div class="autocomplete-list" id="autocomplete-list" style="display:none"></div>
      </div>
      <p class="form-hint" id="apt-name-hint">지역 선택 후 이름을 입력하면 자동검색됩니다</p>
    </div>
    <div class="form-group">
      <label class="form-label">평형 선택 <span class="req">*</span> <span style="color:var(--muted);font-weight:400">(최대 2개)</span></label>
      <div class="pyeong-btns">
        <button class="pyeong-btn" data-key="10" onclick="togglePyeong(this)">10평대</button>
        <button class="pyeong-btn" data-key="20" onclick="togglePyeong(this)">20평대</button>
        <button class="pyeong-btn" data-key="30" onclick="togglePyeong(this)">30평대</button>
        <button class="pyeong-btn" data-key="40" onclick="togglePyeong(this)">40평대</button>
        <button class="pyeong-btn" data-key="50" onclick="togglePyeong(this)">50평이상</button>
      </div>
      <p class="pyeong-hint" id="pyeong-hint">1개 이상 선택해주세요</p>
    </div>
    <button class="btn-primary" onclick="addApartment()">추가하기</button>
  </div>
</div>

<!-- DETAIL SHEET -->
<div class="sheet-backdrop" id="detail-sheet" onmousedown="onBackdropDown(event)" onclick="backdropClose(event,'detail-sheet')">
  <div class="sheet-box" role="dialog" aria-modal="true" aria-label="실거래 상세 내역">
    <div class="sheet-head">
      <div class="sheet-head-top">
        <div>
          <div class="sheet-title" id="sheet-title">-</div>
          <div class="sheet-sub" id="sheet-sub">-</div>
        </div>
        <button class="modal-close" aria-label="닫기" onclick="closeModal('detail-sheet')">×</button>
      </div>
      <div class="detail-tabs" id="detail-tabs"></div>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="toast"></div>

<!-- 순수 로직 헬퍼(포맷·평형·통계·매칭·이스케이프). 테스트: tests/apt-tracker.test.js -->
<script src="apt-tracker.lib.js"></script>
<script>
// PYEONG_DEFS·formatPrice·fmtDate·pyeongStr·pyeongShort·getLastNMonths·calcStats·
// periodLabel·normalizeName·escapeHtml·matchByName·bucketByPyeong 는 apt-tracker.lib.js(window 전역)에서 제공.

const REGIONS = [
  {code:"11110",name:"서울 종로구",   city:"서울특별시",gu:"종로구"},
  {code:"11140",name:"서울 중구",     city:"서울특별시",gu:"중구"},
  {code:"11170",name:"서울 용산구",   city:"서울특별시",gu:"용산구"},
  {code:"11200",name:"서울 성동구",   city:"서울특별시",gu:"성동구"},
  {code:"11215",name:"서울 광진구",   city:"서울특별시",gu:"광진구"},
  {code:"11230",name:"서울 동대문구", city:"서울특별시",gu:"동대문구"},

// ── 배치 fetch: 서버에서 여러 달 병렬 처리 ─────────────────────
async function fetchBatchChunk(lawdCd, ymds) {
  // 단일 청크 요청
  const url = `batch.php?LAWD_CD=${lawdCd}&YMDS=${ymds.join(',')}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`서버 오류 ${res.status}`);
  const map = await res.json();
  const result = {};
  for (const [ymd, items] of Object.entries(map)) {
    if (!Array.isArray(items)) { result[ymd] = []; continue; }
    result[ymd] = items
      .filter(item => item && item.n && item.p > 0)
      .map(item => {
        try {
          const mo = String(item.m||'').padStart(2,'0');
          const dy = String(item.d||'').padStart(2,'0');
          const yr = String(item.y||'');
          const area = parseFloat(item.a)||0;
          return {
            aptName: item.n, dong: String(item.u||''), area,
            floor: String(item.f||'-'),
            price: item.p, year: yr, month: mo, day: dy,
            id: `${item.n}_${item.u||''}_${yr}${mo}${dy}_F${item.f}_${item.a}`,
          };
        } catch(e){ return null; }
      })
      .filter(Boolean);
  }
  return result;
}

async function fetchBatch(lawdCd, ymds) {
  // batch.php 가 서버에서 curl_multi 로 모든 달을 병렬 처리하므로,
  // 큰 청크(20개월)를 한 번에 병렬로 보내 왕복 라운드를 최소화한다.
  // (예전 12개월×2병렬은 5년 조회를 3라운드로 직렬화해 느렸음)
  const CHUNK = 20;
  const MAX_PARALLEL = 3;   // 동시 요청 상한 (cafe24 동시 PHP·API 부하 보호)
  const chunks = [];
  for (let i = 0; i < ymds.length; i += CHUNK) chunks.push(ymds.slice(i, i + CHUNK));

  const merged = {};
  for (let i = 0; i < chunks.length; i += MAX_PARALLEL) {
    const group = chunks.slice(i, i + MAX_PARALLEL);
    const results = await Promise.allSettled(group.map(c => fetchBatchChunk(lawdCd, c)));
    for (const r of results) {
      if (r.status === 'fulfilled') Object.assign(merged, r.value);
      else console.warn('[fetchBatch] 청크 실패:', r.reason?.message);
    }
  }
  return merged;
}

let refreshGen = 0;  // 조회 세대: 기간 변경 등으로 새 조회가 시작되면 이전 조회 결과를 폐기
// suppressNew=true → '신규(+N)' 계산 생략(기간 변경 등, 실제 새 데이터가 아님)
async function refreshAll(suppressNew){
  if(!apartments.length) return;
  const gen = ++refreshGen;   // 이 조회의 세대 (더 최신 조회가 시작되면 gen !== refreshGen)
  isRefreshing=true;

  // 지역별 그룹화: 같은 lawdCd는 API 한 번만 호출
  const regionMap = {};
  apartments.forEach(apt => {
    if(!regionMap[apt.lawdCd]) regionMap[apt.lawdCd] = [];
    regionMap[apt.lawdCd].push(apt);
  });

  const ymds = getLastNMonths(currentPeriod);   // 조회 시작 시점의 기간 스냅샷
  // 지역별 병렬 조회
  await Promise.all(Object.entries(regionMap).map(async ([lawdCd, apts]) => {
    try {
      const batchResult = await fetchBatch(lawdCd, ymds);
      if(gen !== refreshGen) return;   // 더 최신 조회가 시작됨 → 이 결과 폐기(구 기간 덮어쓰기 방지)
      const regionAll = Object.values(batchResult).flat().filter(Boolean);
      computeRegionAvg(lawdCd, regionAll);   // 지역평균 대비용

      for (const apt of apts) {
        if(!apartments.some(a=>a.id===apt.id)) continue;   // 조회 중 삭제된 아파트 스킵(고아 상태 방지)
        // 이름+법정동 정확 일치 — 이웃/동명 단지 혼입 방지 (apt.dong 없으면 하위호환: 이름만)
        const matched = regionAll.filter(tx => sameApt(tx, apt.aptName, apt.dong));
        const result = {};
        for(const p of apt.pyeongs){
          result[p] = bucketByPyeong(matched, p);
        }
        transactions[apt.id] = result;
        const allTxs = Object.values(result).flat();
        if(suppressNew){
          newCounts[apt.id] = 0;   // 기간 변경 등: 창만 넓어졌을 뿐 새 거래 아님
        } else {
          const seen = lastSeen[apt.id]||new Set();
          newCounts[apt.id] = allTxs.filter(tx=>!seen.has(tx.id)).length;
        }
        lastSeen[apt.id] = new Set(allTxs.map(t=>t.id));
      }
    } catch(e){
      if(gen !== refreshGen) return;
      console.error(`지역 ${lawdCd} 조회 실패:`, e.message);
      toast(`⚠ 조회 실패: ${e.message}`, 5000);
    }
  }));

  if(gen !== refreshGen) return;   // 최신 조회가 아니면 렌더/완료토스트 스킵
  saveSeen();
  renderGrid();
  isRefreshing=false;
  if(selectedAptIds.length) renderChart();
  toast('✅ 조회 완료!');
}

// 스파크라인 SVG 생성 (최근 5건 추세)
function renderSparkline(txs, color) {
  const pts = txs.slice(0, 5).reverse(); // 오래된 순 → 최신
  if(pts.length < 2) {
    if(pts.length === 1) {
      return `<svg class="card-sparkline" viewBox="0 0 100 32" preserveAspectRatio="none">
        <circle cx="50" cy="16" r="3" fill="${color}" opacity="0.7"/>
      </svg>`;
    }
    return '';
  }
  const prices = pts.map(t => t.price);
  const minP = Math.min(...prices), maxP = Math.max(...prices);
  const range = maxP - minP || 1;
  const W = 100, H = 28, pad = 4;
  const xStep = (W - pad*2) / (pts.length - 1);
  const toY = p => H - pad - ((p - minP) / range) * (H - pad*2);
  const coords = pts.map((t, i) => ({ x: pad + i*xStep, y: toY(t.price), t }));
  const line = coords.map((c,i) => `${i===0?'M':'L'}${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
  const area = `${line} L${coords[coords.length-1].x.toFixed(1)},${H} L${pad},${H} Z`;
  // 추세 방향 (처음 → 마지막)
  const trend = pts[pts.length-1].price >= pts[0].price;
  const lineColor = trend ? '#34d399' : '#f87171';
  return `<svg class="card-sparkline" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="overflow:visible">
    <defs>
      <linearGradient id="sg-${Math.random().toString(36).slice(2)}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${lineColor}" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="${lineColor}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="${lineColor}" opacity="0.15"/>
    <path d="${line}" fill="none" stroke="${lineColor}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${coords.map((c,i) => {
      const isLast = i === coords.length-1;
      return isLast ? `<circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="2.5" fill="${lineColor}" stroke="#0b1220" stroke-width="1.5"/>` : '';
    }).join('')}
  </svg>`;
}

  const selCls = selIdx >= 0 ? ` ${CHART_COLORS[selIdx].cls}` : '';

  let priceHtml = '', prevHtml = '', statChips = '', hiloBadge = '';

  } else {
    const txs = txMap[pyeong] || [];

    if(!stats){
      priceHtml = `<div style="font-size:11px;color:var(--muted);padding:4px 0">${periodLabel(currentPeriod)} 내 거래없음</div>`;
    } else {

      const prevPriceStr = prevTx ? formatPrice(prevTx.price) : null;
      const chgVal = stats.change;
      const chgCls = chgVal===null?'neu':chgVal>0?'up':'down';
      const chgIcon = chgVal===null?'─':chgVal>0?'▲':'▼';
      const chgStr = chgVal===null?'-':`${chgIcon}${Math.abs(chgVal).toFixed(1)}%`;
      const latestDate = fmtDate(stats.latest.year, stats.latest.month, stats.latest.day);
      const prevDate = prevTx ? fmtDate(prevTx.year, prevTx.month, prevTx.day) : null;
      // 최근 거래가 오래됐으면(6개월+) 표시 — '최근가'가 실은 과거임을 명시
      const mAgo = monthsSince(stats.latest.year, stats.latest.month);
      const staleTag = mAgo >= 6 ? `<span class="stale-tag">${agoLabel(mAgo)}</span>` : '';
      // 컴팩트에서도 보이는 최근가 + 변동률
      priceHtml = `
        <div class="card-price-row">
          <div class="card-price-main">${formatPrice(stats.latest.price)}</div>
          <span class="card-chg ${chgCls}">${chgStr}</span>
          ${staleTag}
          <div class="card-price-date">${latestDate} · ${stats.latest.floor}층</div>
        </div>`;
      // 상세부: 직전 거래
      prevHtml = prevPriceStr ? `
        <div class="card-price-row card-price-row-prev">
          <div class="card-price-label muted">직전</div>
          <div class="card-price-prev-val"><span>${prevPriceStr}</span></div>
          <div class="card-price-date muted">${prevDate} · ${prevTx.floor}층</div>
        </div>` : `<div class="card-price-date muted" style="margin-top:4px">직전 거래 없음</div>`;

      // ── 타이밍·지역평균 지표 (A + C 1단계) ──
      const fh = Math.round(stats.fromHigh);              // 고점 대비 %(≤0)
      const rAvg = (regionAvg[apt.lawdCd]||{})[pyeong] || 0;
      const aptAvg = avgPyeongPrice(txs);
      let regionChip = '';
      if(rAvg > 0 && aptAvg > 0){
        const d = Math.round((aptAvg - rAvg)/rAvg*100);
        regionChip = `<span class="stat-chip"><b>지역평균</b> <span class="${d>=0?'up-color':'down-color'}">${d>=0?'+':''}${d}%</span></span>`;
      }
      statChips = `<div class="card-stats">
        <span class="stat-chip"><b>고점대비</b> <span class="${fh<0?'down-color':'neu-color'}">${fh}%</span></span>
        ${regionChip}
        <span class="stat-chip"><b>거래</b> ${stats.count}건</span>
      </div>`;
      // 신고가/신저가(기간 내). 거래 2건 이상일 때만 의미 부여
      hiloBadge = (stats.isHigh && txs.length>=2) ? `<span class="hilo-badge hi">신고가</span>`
        : (stats.isLow && txs.length>=2) ? `<span class="hilo-badge lo">신저가</span>` : '';
    }
  }

  // 스파크라인 (최근 5건, 기간 관계없이)
  const sparkTxs = txMap ? (txMap[pyeong] || []) : [];
  const selColor = selIdx >= 0 ? CHART_COLORS[selIdx].line : '#718096';
  const sparkSvg = sparkTxs.length >= 2 ? renderSparkline(sparkTxs, selColor) : '';

  const safeName = escapeHtml(apt.aptName);
  const act = `selectCard('${apt.id}','${pyeong}');markRead('${apt.id}')`;
  return `<div class="apt-card${selCls}" id="card-${apt.id}-${pyeong}"
    role="button" tabindex="0" aria-label="${safeName} ${PYEONG_DEFS[pyeong].label} 실거래 비교 선택"
    onclick="${act}"
    onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();${act};}">
    <div class="card-head">
      <div style="min-width:0;flex:1">
        <div class="card-apt-name">${safeName} ${hiloBadge}</div>
        <div class="card-apt-region">${escapeHtml(apt.regionName)}${apt.dong?' · '+escapeHtml(apt.dong):''}</div>
      </div>
      ${badge}
      <div class="card-actions">
        <button class="card-icon-btn" title="실거래 상세 내역" aria-label="${safeName} 실거래 상세 내역"
          onclick="event.stopPropagation();openDetail('${apt.id}')">☰</button>
        <button class="card-icon-btn card-remove" title="삭제" aria-label="${safeName} 관심목록에서 삭제"
          onclick="event.stopPropagation();removeApt('${apt.id}')">×</button>
      </div>
    </div>
    ${priceHtml}
    <div class="card-detail">
      ${prevHtml}
      ${sparkSvg}
      ${statChips}
    </div>
  </div>`;
}

function togglePyeong(btn){
  const p=btn.dataset.key;
  const isActive=btn.classList.contains('active');
  // 비활성 버튼인데 이미 2개 선택된 경우 → 무시
  if(!isActive && selectedPyeongs.length>=2) return;
  if(isActive){
    btn.classList.remove('active');
    selectedPyeongs=selectedPyeongs.filter(x=>x!==p);
  } else {
    btn.classList.add('active');
    selectedPyeongs.push(p);
  }
  // 2개 선택 시 비선택 버튼만 시각적으로 흐리게 (disabled 속성 사용 안 함)
  const full=selectedPyeongs.length>=2;
  document.querySelectorAll('.pyeong-btn').forEach(b=>{
    const inactive=!b.classList.contains('active');
    b.style.opacity = (full && inactive) ? '0.3' : '1';
    b.style.cursor  = (full && inactive) ? 'not-allowed' : 'pointer';
    b.style.pointerEvents = (full && inactive) ? 'none' : 'auto';
  });
  const hint=document.getElementById('pyeong-hint');
  hint.textContent=selectedPyeongs.length?selectedPyeongs.map(p=>PYEONG_DEFS[p].label).join(', ')+' 선택됨':'1개 이상 선택해주세요';
  hint.style.color=selectedPyeongs.length?'var(--accent)':'var(--muted)';
}

const DEFAULT_REGION_PILLS=['11680','11650','11710','41135','11440']; // 강남·서초·송파·분당·마포
function loadRegionUsage(){ try{ return JSON.parse(localStorage.getItem('apt_region_usage')||'{}'); }catch(e){ return {}; } }
function bumpRegionUsage(code){
  const u=loadRegionUsage(); u[code]=(u[code]||0)+1;
  try{ localStorage.setItem('apt_region_usage', JSON.stringify(u)); }catch(e){}
}
function topRegionPills(n){
  const u=loadRegionUsage();
  const used=Object.keys(u).filter(c=>REGIONS.some(r=>r.code===c)).sort((a,b)=>u[b]-u[a]);
  const ordered=[...used];
  DEFAULT_REGION_PILLS.forEach(c=>{ if(!ordered.includes(c)) ordered.push(c); });
  return ordered.slice(0,n);
}
function renderQuickPills(){
  const el=document.getElementById('quick-region-pills'); if(!el) return;
  el.innerHTML='<span class="quick-pills-label">자주 선택</span>'+topRegionPills(5).map(c=>{
    const r=REGIONS.find(x=>x.code===c); if(!r) return '';
    // 구/군만 짧게 (r.gu, 예: '강남구' · '성남시 분당구'). title 에 전체 지역명.
    return `<button class="quick-pill" title="${escapeHtml(r.name)}" onclick="pickRegionPill('${c}')">${escapeHtml(r.gu)}</button>`;
  }).join('');
}
function pickRegionPill(code){

// 자동완성 상태
let acCache = {};      // `${regionCode}_${period}` → 전체 tx 캐시
let acTimer = null;
let acFocusIdx = -1;
let acResults = [];    // [{name, dong, count}]
let acSeq = 0;         // 응답 순서 보장 토큰 (뒤늦게 온 이전 검색 결과 폐기)
let selectedDong = ''; // 자동완성에서 고른 항목의 법정동 (동명 아파트 구분)

async function onAptNameInput(val) {
  const hint = document.getElementById('apt-name-hint');
  const list = document.getElementById('autocomplete-list');
  clearTimeout(acTimer);
  acFocusIdx = -1;
  selectedDong = '';     // 타이핑 시작 → 이전 선택 동 초기화
  const seq = ++acSeq;   // 이 입력의 순번

  if (!val.trim()) {
    list.style.display = 'none';
    hint.textContent = '지역 선택 후 이름을 입력하면 자동검색됩니다';
    hint.style.color = 'var(--muted)';
    return;
  }
  if (val.trim().length < 2) {
    list.style.display = 'none';
    hint.textContent = '한 글자 더 입력해주세요';
    hint.style.color = 'var(--muted)';
    return;
  }

  const regionCode = document.getElementById('region-select').value;

  // 로딩 표시
  list.style.display = 'block';
  list.innerHTML = `<div class="autocomplete-searching"><span class="spinner" style="width:12px;height:12px;border-width:2px"></span> 검색중...</div>`;

  acTimer = setTimeout(async () => {
    try {
      // 캐시 없으면 API 조회 (현재 기간치)
      const cacheKey = `${regionCode}_${currentPeriod}`;
      if (!acCache[cacheKey]) {
        const ymds = getLastNMonths(currentPeriod);
        const batchResult = await fetchBatch(regionCode, ymds);
        acCache[cacheKey] = Object.values(batchResult).flat();
      }
      if (seq !== acSeq) return;   // 더 최신 입력이 있음 → 이 결과 폐기(순서 뒤바뀜 방지)

      const allTxs = acCache[cacheKey];
      const keyword = val.trim();

      // 매칭 아파트: 이름+법정동으로 그룹핑(동명 아파트 분리) + 건수 집계
      const nameMap = {};
      allTxs.filter(tx => tx.aptName.includes(keyword)).forEach(tx => {
        const k = aptGroupKey(tx.aptName, tx.dong);
        if(!nameMap[k]) nameMap[k] = {name: tx.aptName, dong: tx.dong||'', count: 0};
        nameMap[k].count++;
      });
      acResults = Object.values(nameMap).sort((a, b) => b.count - a.count);

      if (!acResults.length) {
        list.innerHTML = `<div class="autocomplete-searching" style="color:var(--muted)">검색 결과가 없어요</div>`;
        return;
      }

      renderAcList();
    } catch(e) {
      list.innerHTML = `<div class="autocomplete-searching" style="color:var(--down)">조회 실패: ${e.message}</div>`;
    }
  }, 350);
}

function renderAcList() {
  const list = document.getElementById('autocomplete-list');
  list.style.display = 'block';
  list.innerHTML = acResults.map((r, i) => `
    <div class="autocomplete-item${i === acFocusIdx ? ' focused' : ''}"
      onmousedown="selectAcItem(${i})">
      <span class="autocomplete-item-name">${escapeHtml(r.name)}${r.dong?` <span class="ac-dong">${escapeHtml(r.dong)}</span>`:''}</span>
      <span class="autocomplete-item-count">${r.count}건</span>
    </div>`).join('');
}

function selectAcItem(idx) {
  const item = acResults[idx];
  if (!item) return;
  document.getElementById('apt-name-input').value = item.name;
  selectedDong = item.dong || '';   // 고른 항목의 법정동 기억
  document.getElementById('autocomplete-list').style.display = 'none';
  const hint = document.getElementById('apt-name-hint');
  hint.textContent = item.dong ? `✓ ${item.dong} 선택됨` : '✓ 선택됨';
  hint.style.color = 'var(--accent)';
  acResults = [];
}

function onAptNameKeydown(e) {
  const list = document.getElementById('autocomplete-list');
  const listOpen = list.style.display !== 'none';
  // 목록이 닫혀 있을 때만 Enter 로 바로 제출. (검색중·결과없음 등 목록이 떠 있으면 제출하지 않음)
  if (!listOpen) {
    if (e.key === 'Enter') addApartment();
    return;
  }
  if (e.key === 'ArrowDown' && acResults.length) {
    e.preventDefault();
    acFocusIdx = Math.min(acFocusIdx + 1, acResults.length - 1);
    renderAcList();
    list.querySelectorAll('.autocomplete-item')[acFocusIdx]?.scrollIntoView({block:'nearest'});
  } else if (e.key === 'ArrowUp' && acResults.length) {
    e.preventDefault();
    acFocusIdx = Math.max(acFocusIdx - 1, -1);
    renderAcList();
    if (acFocusIdx >= 0) list.querySelectorAll('.autocomplete-item')[acFocusIdx]?.scrollIntoView({block:'nearest'});
  } else if (e.key === 'Enter') {
    e.preventDefault();
    // 결과가 있으면 하이라이트(또는 첫 항목) 선택. 검색중/결과없음이면 아무것도 안 함(오제출 방지)
    if (acResults.length) selectAcItem(acFocusIdx >= 0 ? acFocusIdx : 0);
  } else if (e.key === 'Escape') {
    list.style.display = 'none';
  }
}

async function addApartment(){
  const exactName = document.getElementById('apt-name-input').value.trim();
  if(!exactName){toast('⚠ 아파트를 검색 후 선택해주세요');return;}
  if(!selectedPyeongs.length){toast('⚠ 평형을 1개 이상 선택해주세요');return;}
  if(apartments.length >= 10){toast('⚠ 아파트는 최대 10개까지 추가할 수 있어요', 3500);return;}
  const region=REGIONS.find(r=>r.code===document.getElementById('region-select').value);

  // 캐시된 데이터 사용, 없으면 재조회
  const ck = `${region.code}_${currentPeriod}`;
  let allTxs = acCache[ck];
  if(!allTxs){
    const btn=document.querySelector('#add-modal .btn-primary');
    btn.disabled=true;btn.innerHTML='<span class="spinner" style="width:13px;height:13px;border-width:2px"></span> 조회중...';
    try{
      const ymds=getLastNMonths(currentPeriod);
      const br=await fetchBatch(region.code,ymds);
      allTxs=Object.values(br).flat();
      acCache[ck]=allTxs;
    }catch(e){toast(`⚠ 조회 실패: ${e.message}`,5000);btn.disabled=false;btn.innerHTML='추가하기';return;}
    btn.disabled=false;btn.innerHTML='추가하기';
  }

  // 법정동 확정: 자동완성 선택값 우선, 없으면 데이터에 동이 유일할 때 자동 지정
  let dong = selectedDong;
  if(!dong){
    const dongs=[...new Set(allTxs.filter(t=>t.aptName===exactName).map(t=>t.dong||''))];
    if(dongs.length===1) dong=dongs[0];
  }
  // 중복 방지 (이름+동+평형 겹치면 차단)
  if(apartments.some(a => a.lawdCd===region.code && a.aptName===exactName && (a.dong||'')===(dong||'')
      && a.pyeongs.some(p => selectedPyeongs.includes(p)))){
    toast('⚠ 이미 추가된 아파트·평형이에요', 3500); return;
  }
  const apt = commitApt(region, exactName, dong, selectedPyeongs, allTxs);
  if(!apt){   // 정확일치 거래 없음(오타·미선택) → 유령 빈 카드 방지
    toast('⚠ 자동완성 목록에서 아파트를 선택하거나 조회 기간을 늘려보세요', 4500);
    return;
  }
  closeModal('add-modal');
  renderGrid();
  toast(`✅ ${exactName} 추가 완료!`);
  // 추가된 아파트의 첫 평형 자동 선택
  if(apt.pyeongs.length>0) setTimeout(()=>selectCard(apt.id, apt.pyeongs[0]),100);
}

// 아파트를 관심목록에 등록 (addApartment·발굴 공용). 이름+동 정확일치 거래 없으면 null.
function commitApt(region, exactName, dong, pyeongs, allTxs){
  computeRegionAvg(region.code, allTxs);   // 지역평균 대비용
  const exactTxs=allTxs.filter(tx=>sameApt(tx, exactName, dong));
  if(!exactTxs.length) return null;
  const apt={id:`${region.code}_${Date.now()}`,lawdCd:region.code,regionName:region.name,aptName:exactName,dong:dong||'',pyeongs:[...pyeongs]};
  const result={};
  for(const p of pyeongs) result[p]=bucketByPyeong(exactTxs, p);
  apartments.push(apt); transactions[apt.id]=result;
  const flat=Object.values(result).flat();
  newCounts[apt.id]=0;   // 방금 추가·조회한 것이므로 '신규' 아님
  lastSeen[apt.id]=new Set(flat.map(t=>t.id));
  saveApts(); saveSeen();
  bumpRegionUsage(region.code);   // '자주 선택' pill 빈도 반영
  return apt;
}

let currentMode='watch';
const DISC_DEFAULT_GU='11590';   // 동작구
let discCity='서울특별시', discGu='', discPyeong='30', discSort='avg';  // 기본: 서울 동작구 30평대 평단가순
let discCache={};   // `${gu}_${period}` -> regionAll
let discRows=[];    // 현재 구·평형의 계산 결과
let discShown=[];   // 정렬·TOP 적용된 렌더 대상 (관심추가 인덱스 참조)

function setMode(mode){

  const bw=document.getElementById('budget-wrap'); if(bw) bw.style.display=watch?'':'none';
  const ab=document.querySelector('.btn-add'); if(ab) ab.style.display=watch?'':'none';
  if(!watch){
    if(!discInited){ initDiscover(); discInited=true; }
    runDiscover();
  }
}

function initDiscover(){
  const cityEl=document.getElementById('disc-city');
  cityEl.innerHTML=CITIES.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  cityEl.value=discCity;
  updateDiscGu(discCity);
  // 기본 구: 동작구 (서울일 때)
  const guEl=document.getElementById('disc-gu');
  if([...guEl.options].some(o=>o.value===DISC_DEFAULT_GU)){ guEl.value=DISC_DEFAULT_GU; discGu=DISC_DEFAULT_GU; }
  document.getElementById('disc-sort').value=discSort;   // 기본 평단가순
  renderDiscPyeong();
}
function updateDiscGu(city){
  const guEl=document.getElementById('disc-gu');
  const filtered=REGIONS.filter(r=>r.city===city);
  guEl.innerHTML=filtered.map(r=>`<option value="${r.code}">${escapeHtml(r.gu)}</option>`).join('');
  discGu=(filtered[0]||{}).code||'';
  guEl.value=discGu;
}
function onDiscCityChange(){ discCity=document.getElementById('disc-city').value; updateDiscGu(discCity); runDiscover(); }
function onDiscGuChange(){ discGu=document.getElementById('disc-gu').value; runDiscover(); }
function renderDiscPyeong(){
  document.getElementById('disc-pyeong').innerHTML=['10','20','30','40','50'].map(p=>
    `<button class="disc-pyeong-btn${p===discPyeong?' active':''}" aria-pressed="${p===discPyeong}" onclick="setDiscPyeong('${p}')">${PYEONG_DEFS[p].label}</button>`
  ).join('');
}
function setDiscPyeong(p){ discPyeong=p; renderDiscPyeong(); computeAndRenderDiscover(); }

async function runDiscover(){
  if(!discGu) return;
  const resultsEl=document.getElementById('discover-results');
  const gen=++discGen;
  resultsEl.innerHTML=`<div class="card-loading"><span class="spinner"></span> 조회중...</div>`;
  document.getElementById('discover-note').textContent='';
  const ck=`${discGu}_${currentPeriod}`;
  let regionAll=discCache[ck];
  if(!regionAll){
    try{
      const ymds=getLastNMonths(currentPeriod);
      const br=await fetchBatch(discGu, ymds);
      if(gen!==discGen) return;   // 더 최신 요청 있음 → 폐기
      regionAll=Object.values(br).flat().filter(Boolean);
      discCache[ck]=regionAll;
    }catch(e){
      if(gen!==discGen) return;
      resultsEl.innerHTML=`<div class="tx-no">조회 실패: ${escapeHtml(e.message)}</div>`;
      return;
    }
  }
  if(gen!==discGen) return;
  computeRegionAvg(discGu, regionAll);
  computeAndRenderDiscover();
}

function computeAndRenderDiscover(){
  const regionAll=discCache[`${discGu}_${currentPeriod}`];
  if(!regionAll) return;
  const byKey={};   // 이름+법정동으로 그룹핑(동명 아파트 분리)
  regionAll.forEach(tx=>{ const k=aptGroupKey(tx.aptName, tx.dong); (byKey[k]=byKey[k]||[]).push(tx); });
  const rAvg=(regionAvg[discGu]||{})[discPyeong]||0;
  discRows=[];
  Object.keys(byKey).forEach(k=>{
    const grp=byKey[k];
    const bucket=bucketByPyeong(grp, discPyeong);
    if(bucket.length<3) return;   // 노이즈 방지: 기간 내 거래 3건 이상만
    const stats=calcStats(bucket);
    const avg=avgPyeongPrice(bucket);
    discRows.push({ name:grp[0].aptName, dong:grp[0].dong||'', latest:stats.latest.price, count:bucket.length,
      latestY:stats.latest.year, latestM:stats.latest.month,
      growth:growthRate(bucket), avg,
      regionDiff: rAvg>0?(avg-rAvg)/rAvg*100:null, isHigh:stats.isHigh });
  });
  renderDiscover();
}

// 한 행 렌더 (idx=discShown 내 위치, rank=표시순위)
function discRowHtml(r, idx, rank){
  const already = apartments.some(a=>a.lawdCd===discGu && a.aptName===r.name && (a.dong||'')===(r.dong||'') && a.pyeongs.includes(discPyeong));
  const g=r.growth;
  const gTxt = g==null ? '-' : `${g>=0?'+':''}${g.toFixed(1)}%`;
  const gCls = g==null ? 'neu-color' : g>=0 ? 'up-color' : 'down-color';

  // 정렬 기준 지표를 오른쪽에 크게 강조 (라벨 포함)
  let primVal, primLbl, primCls='accent-color';
  if(discSort==='avg'){ primVal=`${r.avg.toLocaleString()}<span class="disc-unit">만/평</span>`; primLbl='평단가'; }
  else if(discSort==='count'){ primVal=`${r.count}<span class="disc-unit">건</span>`; primLbl='거래량'; }
  else { primVal=gTxt; primLbl='상승률'; primCls=gCls; }

  // 메타: 정렬 기준 제외한 보조 지표만
  const rowMAgo=monthsSince(r.latestY, r.latestM);
  const rowStale=rowMAgo>=6?` <span class="stale-tag">${agoLabel(rowMAgo)}</span>`:'';
  const meta=[`최근 ${formatPrice(r.latest)}${rowStale}`];
  if(discSort!=='count') meta.push(`${r.count}건`);
  if(discSort!=='avg') meta.push(`${r.avg.toLocaleString()}만/평`);
  if(discSort!=='growth' && g!=null) meta.push(`<span class="${gCls}">${gTxt}</span>`);
  if(r.regionDiff!=null) meta.push(`<span class="${r.regionDiff>=0?'up-color':'down-color'}">지역평균 ${r.regionDiff>=0?'+':''}${Math.round(r.regionDiff)}%</span>`);

  return `<div class="disc-row">
    <div class="disc-rank">${rank}</div>
    <div class="disc-main">
      <div class="disc-name">${escapeHtml(r.name)}${r.dong?` <span class="disc-dong">${escapeHtml(r.dong)}</span>`:''} ${r.isHigh?'<span class="hilo-badge hi">신고가</span>':''}</div>
      <div class="disc-meta">${meta.join(' · ')}</div>
    </div>
    <div class="disc-metric">
      <div class="disc-metric-val ${primCls}">${primVal}</div>
      <div class="disc-metric-lbl">${primLbl}</div>
    </div>
    <button class="disc-add" ${already?'disabled':''} onclick="addFromDiscover(${idx})">${already?'추가됨':'＋관심'}</button>
  </div>`;
}

function renderDiscover(){
  discSort=document.getElementById('disc-sort').value;
  const resultsEl=document.getElementById('discover-results');
  const noteEl=document.getElementById('discover-note');
  const region=REGIONS.find(r=>r.code===discGu);
  const regionName=region?region.name:'';

  let rows=discRows.slice();
  if(discSort==='growth'){
    rows=rows.filter(r=>r.growth!=null);   // 추세 산출 가능(관측 3개월↑) 단지만
    rows.sort((a,b)=>b.growth-a.growth);
  } else if(discSort==='count'){
    rows.sort((a,b)=>b.count-a.count);
  } else {
    rows.sort((a,b)=>b.avg-a.avg);
  }
  discShown=rows.slice(0,30);
  const sortNote = discSort==='growth' ? '상승률 = 월별 중앙값 평단가 추세선(회귀, 관측 3개월↑)'
    : discSort==='count' ? '거래량순' : '평단가순';
  noteEl.textContent=`${regionName} · ${PYEONG_DEFS[discPyeong].label} · 최근 ${periodLabel(currentPeriod)} · ${rows.length}개 단지(거래 3건↑) · ${sortNote}`;
  if(!discShown.length){
    const msg = discSort==='growth'
      ? '이 조건에 맞는 단지가 없어요 (관측 3개월 이상 거래 필요).<br>다른 평형·구를 선택하거나 기간을 늘려보세요.'
      : '조건에 맞는 단지가 없어요 (기간 내 거래 3건 이상 필요).';
    resultsEl.innerHTML=`<div class="tx-no">${msg}</div>`;
    return;
  }
  resultsEl.innerHTML=discShown.map((r,i)=>discRowHtml(r, i, i+1)).join('');
}

function addFromDiscover(idx){
  const row=discShown[idx];
  if(!row) return;
  if(apartments.length>=10){ toast('⚠ 아파트는 최대 10개까지 추가할 수 있어요', 3500); return; }
  const region=REGIONS.find(r=>r.code===discGu);
  if(apartments.some(a=>a.lawdCd===discGu && a.aptName===row.name && (a.dong||'')===(row.dong||'') && a.pyeongs.includes(discPyeong))){
    toast('⚠ 이미 추가된 아파트·평형이에요', 3000); return;
  }
  const regionAll=discCache[`${discGu}_${currentPeriod}`];
  if(!regionAll){ toast('⚠ 데이터가 없어요, 다시 시도해주세요'); return; }
  const apt=commitApt(region, row.name, row.dong, [discPyeong], regionAll);
  if(!apt){ toast('⚠ 추가 실패'); return; }
  renderGrid();
  toast(`✅ ${row.name} 관심목록 추가!`);
  renderDiscover();   // 버튼 '추가됨' 상태 갱신
}
