// 자동완성 상태
let acCache = {};      // `${regionCode}_${period}` → 전체 tx 캐시
let acTimer = null;
let acFocusIdx = -1;
let acResults = [];    // [{name, dong, count}]
let acSeq = 0;         // 응답 순서 보장 토큰 (뒤늦게 온 이전 검색 결과 폐기)
let selectedDong = ''; // 자동완성에서 고른 항목의 법정동 (동명 아파트 구분)

async function onAptNameInput(val) {
  const hint = document.getElementById('apt-name-hint');
  const list = document.getElementById('autocomplete-list');
  clearTimeout(acTimer);
  acFocusIdx = -1;
  selectedDong = '';     // 타이핑 시작 → 이전 선택 동 초기화
  const seq = ++acSeq;   // 이 입력의 순번

  if (!val.trim()) {
    list.style.display = 'none';
    hint.textContent = '지역 선택 후 이름을 입력하면 자동검색됩니다';
    hint.style.color = 'var(--muted)';
    return;
  }
  if (val.trim().length < 2) {
    list.style.display = 'none';
    hint.textContent = '한 글자 더 입력해주세요';
    hint.style.color = 'var(--muted)';
    return;
  }

  const regionCode = document.getElementById('region-select').value;

  // 로딩 표시
  list.style.display = 'block';
  list.innerHTML = `<div class="autocomplete-searching"><span class="spinner" style="width:12px;height:12px;border-width:2px"></span> 검색중...</div>`;

  acTimer = setTimeout(async () => {
    try {
      // 캐시 없으면 API 조회 (현재 기간치)
      const cacheKey = `${regionCode}_${currentPeriod}`;
      if (!acCache[cacheKey]) {
        const ymds = getLastNMonths(currentPeriod);
        const batchResult = await fetchBatch(regionCode, ymds);
        acCache[cacheKey] = Object.values(batchResult).flat();
      }
      if (seq !== acSeq) return;   // 더 최신 입력이 있음 → 이 결과 폐기(순서 뒤바뀜 방지)

      const allTxs = acCache[cacheKey];
      const keyword = val.trim();

      // 매칭 아파트: 이름+법정동으로 그룹핑(동명 아파트 분리) + 건수 집계
      const nameMap = {};
      allTxs.filter(tx => tx.aptName.includes(keyword)).forEach(tx => {
        const k = aptGroupKey(tx.aptName, tx.dong);
        if(!nameMap[k]) nameMap[k] = {name: tx.aptName, dong: tx.dong||'', count: 0};
        nameMap[k].count++;
      });
      acResults = Object.values(nameMap).sort((a, b) => b.count - a.count);

      if (!acResults.length) {
        list.innerHTML = `<div class="autocomplete-searching" style="color:var(--muted)">검색 결과가 없어요</div>`;
        return;
      }

      renderAcList();
    } catch(e) {
      list.innerHTML = `<div class="autocomplete-searching" style="color:var(--down)">조회 실패: ${e.message}</div>`;
    }
  }, 350);
}

function renderAcList() {
  const list = document.getElementById('autocomplete-list');
  list.style.display = 'block';
  list.innerHTML = acResults.map((r, i) => `
    <div class="autocomplete-item${i === acFocusIdx ? ' focused' : ''}"
      onmousedown="selectAcItem(${i})">
      <span class="autocomplete-item-name">${escapeHtml(r.name)}${r.dong?` <span class="ac-dong">${escapeHtml(r.dong)}</span>`:''}</span>
      <span class="autocomplete-item-count">${r.count}건</span>
    </div>`).join('');
}

function selectAcItem(idx) {
  const item = acResults[idx];
  if (!item) return;
  document.getElementById('apt-name-input').value = item.name;
  selectedDong = item.dong || '';   // 고른 항목의 법정동 기억
  document.getElementById('autocomplete-list').style.display = 'none';
  const hint = document.getElementById('apt-name-hint');
  hint.textContent = item.dong ? `✓ ${item.dong} 선택됨` : '✓ 선택됨';
  hint.style.color = 'var(--accent)';
  acResults = [];
}

function onAptNameKeydown(e) {
  const list = document.getElementById('autocomplete-list');
  const listOpen = list.style.display !== 'none';
  // 목록이 닫혀 있을 때만 Enter 로 바로 제출. (검색중·결과없음 등 목록이 떠 있으면 제출하지 않음)
  if (!listOpen) {
    if (e.key === 'Enter') addApartment();
    return;
  }
  if (e.key === 'ArrowDown' && acResults.length) {
    e.preventDefault();
    acFocusIdx = Math.min(acFocusIdx + 1, acResults.length - 1);
    renderAcList();
    list.querySelectorAll('.autocomplete-item')[acFocusIdx]?.scrollIntoView({block:'nearest'});
  } else if (e.key === 'ArrowUp' && acResults.length) {
    e.preventDefault();
    acFocusIdx = Math.max(acFocusIdx - 1, -1);
    renderAcList();
    if (acFocusIdx >= 0) list.querySelectorAll('.autocomplete-item')[acFocusIdx]?.scrollIntoView({block:'nearest'});
  } else if (e.key === 'Enter') {
    e.preventDefault();
    // 결과가 있으면 하이라이트(또는 첫 항목) 선택. 검색중/결과없음이면 아무것도 안 함(오제출 방지)
    if (acResults.length) selectAcItem(acFocusIdx >= 0 ? acFocusIdx : 0);
  } else if (e.key === 'Escape') {
    list.style.display = 'none';
  }
}

async function addApartment(){
  const exactName = document.getElementById('apt-name-input').value.trim();
  if(!exactName){toast('⚠ 아파트를 검색 후 선택해주세요');return;}
  if(!selectedPyeongs.length){toast('⚠ 평형을 1개 이상 선택해주세요');return;}
  if(apartments.length >= 10){toast('⚠ 아파트는 최대 10개까지 추가할 수 있어요', 3500);return;}
  const region=REGIONS.find(r=>r.code===document.getElementById('region-select').value);

  // 캐시된 데이터 사용, 없으면 재조회
  const ck = `${region.code}_${currentPeriod}`;
  let allTxs = acCache[ck];
  if(!allTxs){
    const btn=document.querySelector('#add-modal .btn-primary');
    btn.disabled=true;btn.innerHTML='<span class="spinner" style="width:13px;height:13px;border-width:2px"></span> 조회중...';
    try{
      const ymds=getLastNMonths(currentPeriod);
      const br=await fetchBatch(region.code,ymds);
      allTxs=Object.values(br).flat();
      acCache[ck]=allTxs;
    }catch(e){toast(`⚠ 조회 실패: ${e.message}`,5000);btn.disabled=false;btn.innerHTML='추가하기';return;}
    btn.disabled=false;btn.innerHTML='추가하기';
  }

  // 법정동 확정: 자동완성 선택값 우선, 없으면 데이터에 동이 유일할 때 자동 지정
  let dong = selectedDong;
  if(!dong){
    const dongs=[...new Set(allTxs.filter(t=>t.aptName===exactName).map(t=>t.dong||''))];
    if(dongs.length===1) dong=dongs[0];
  }
  // 중복 방지 (이름+동+평형 겹치면 차단)
  if(apartments.some(a => a.lawdCd===region.code && a.aptName===exactName && (a.dong||'')===(dong||'')
      && a.pyeongs.some(p => selectedPyeongs.includes(p)))){
    toast('⚠ 이미 추가된 아파트·평형이에요', 3500); return;
  }
  const apt = commitApt(region, exactName, dong, selectedPyeongs, allTxs);
  if(!apt){   // 정확일치 거래 없음(오타·미선택) → 유령 빈 카드 방지
    toast('⚠ 자동완성 목록에서 아파트를 선택하거나 조회 기간을 늘려보세요', 4500);
    return;
  }
  closeModal('add-modal');
  renderGrid();
  toast(`✅ ${exactName} 추가 완료!`);
  // 추가된 아파트의 첫 평형 자동 선택
  if(apt.pyeongs.length>0) setTimeout(()=>selectCard(apt.id, apt.pyeongs[0]),100);
}

// 아파트를 관심목록에 등록 (addApartment·발굴 공용). 이름+동 정확일치 거래 없으면 null.
function commitApt(region, exactName, dong, pyeongs, allTxs){
  computeRegionAvg(region.code, allTxs);   // 지역평균 대비용
  const exactTxs=allTxs.filter(tx=>sameApt(tx, exactName, dong));
  if(!exactTxs.length) return null;
  const apt={id:`${region.code}_${Date.now()}`,lawdCd:region.code,regionName:region.name,aptName:exactName,dong:dong||'',pyeongs:[...pyeongs]};
  const result={};
  for(const p of pyeongs) result[p]=bucketByPyeong(exactTxs, p);
  apartments.push(apt); transactions[apt.id]=result;
  const flat=Object.values(result).flat();
  newCounts[apt.id]=0;   // 방금 추가·조회한 것이므로 '신규' 아님
  lastSeen[apt.id]=new Set(flat.map(t=>t.id));
  saveApts(); saveSeen();
  bumpRegionUsage(region.code);   // '자주 선택' pill 빈도 반영
  return apt;
}

// ─── 발굴 랭킹 (구 전체 단지 순위) ───────────────────────────────
let currentMode='watch';
const DISC_DEFAULT_GU='11590';   // 동작구
let discCity='서울특별시', discGu='', discPyeong='30', discSort='avg';  // 기본: 서울 동작구 30평대 평단가순
let discSimilar=null;   // 비슷한 단지 모드 컨텍스트 {name,dong,lawd,avg,band} — 발굴 뷰에 얹음
let discCache={};   // `${gu}_${period}` -> regionAll
let aggCache={};    // `${lawd}_${ymdsKey}_${pyeong}` -> agg.php rows (구/군 전체 평단가 집계)

// 구/군 전체 평단가 집계 — agg.php (단지별 평단가). 비슷한 평단가 찾기 '전체' 검색용.
async function fetchAgg(lawd, ymds, pmin, pmax){
  const url=`agg.php?LAWD=${lawd}&YMDS=${ymds.join(',')}&PMIN=${pmin}&PMAX=${pmax}`;
  const r=await fetch(url);
  if(!r.ok) throw new Error('agg '+r.status);
  const j=await r.json();
  return (j && j.rows) ? j.rows : [];
}
// 집계 결과를 localStorage 에도 캐시(3시간) → 새로고침·세션 넘어 재사용(콜드 최소화)
var AGG_LS_TTL=3*3600*1000;
function loadAggLS(key){ try{ const v=JSON.parse(localStorage.getItem('aggc:'+key)||'null'); if(v && (Date.now()-v.t)<AGG_LS_TTL) return v.r; }catch(e){} return null; }
function saveAggLS(key, rows){
  try{ localStorage.setItem('aggc:'+key, JSON.stringify({t:Date.now(), r:rows})); }
  catch(e){ try{ Object.keys(localStorage).forEach(k=>{ if(k.indexOf('aggc:')===0) localStorage.removeItem(k); }); localStorage.setItem('aggc:'+key, JSON.stringify({t:Date.now(), r:rows})); }catch(e2){} }
}
// 전체 구를 연속 워커 풀로 집계 → 도착하는 대로 점진적 리스트업(배치 대기 없음 → 빠름)
const ALL_MONTHS = 5;   // 전체 검색은 최근 5개월 평단가로 제한(속도·upstream 부하)
async function runDiscoverAll(){
  const gen=++discGen;
  const resultsEl=document.getElementById('discover-results');
  // 전체면 시/도 전체 구, 특정 구면 그 구 하나만 집계(비슷 모드에서 구를 좁힌 경우)
  let regions = discGu==='ALL' ? REGIONS.filter(r=>r.city===discCity) : REGIONS.filter(r=>r.code===discGu);
  // 기준 단지의 구를 맨 앞으로 → 가장 관련 높은 결과(기준+동네 유사가)가 즉시 표시
  if(discSimilar && discSimilar.lawd){
    regions=regions.slice().sort((a,b)=>(a.code===discSimilar.lawd?-1:b.code===discSimilar.lawd?1:0));
  }
  const def=PYEONG_DEFS[discPyeong];
  const ymds=getLastNMonths(Math.min(currentPeriod, ALL_MONTHS));
  const ymdsKey=ALL_MONTHS+'m_'+ymds[0];
  discRows=[]; const merged={}; let done=0, next=0, lastRender=0;
  const scopeLabel = discGu==='ALL' ? `${discCity} 전체` : ((REGIONS.find(r=>r.code===discGu)||{}).name||'');
  resultsEl.innerHTML=`<div class="card-loading"><span class="spinner"></span> ${escapeHtml(scopeLabel)} 평단가 수집중… 0/${regions.length}구</div>`;
  // 진행 중 렌더는 200ms 간격으로 throttle(25회 DOM 재빌드 렉 방지). 완료 시엔 강제 렌더.
  function tick(final){
    const t=Date.now();
    if(final || t-lastRender>200){ lastRender=t; discRows=Object.values(merged); renderDiscover(final?null:`${done}/${regions.length}구 수집중…`); }
  }
  const POOL=10;   // 동시 집계 구 수. 각 구=5개월 단일 웨이브 → 최대 동시 upstream ~50 (WAF 임계 60 미만)
  async function worker(){
    while(next < regions.length){
      if(gen!==discGen) return;
      const reg=regions[next++];
      const ck=`${reg.code}_${ymdsKey}_${discPyeong}`;
      let rows=aggCache[ck] || loadAggLS(ck);
      if(rows){ aggCache[ck]=rows; }
      else { try{ rows=await fetchAgg(reg.code, ymds, def.minM2, def.maxM2); aggCache[ck]=rows; saveAggLS(ck, rows); }catch(e){ rows=[]; } }
      if(gen!==discGen) return;
      rows.forEach(a=>{ merged[reg.code+' '+a.n+' '+(a.u||'')]={
        name:a.n, dong:a.u||'', avg:a.avg, total:a.tp||0, count:a.cnt, latest:a.lp, latestY:a.ly, latestM:a.lm,
        growth:pyeongTrend(a.mv), regionDiff:null, isHigh:false, lawd:reg.code }; });
      done++;
      tick(done>=regions.length);
    }
  }
  const n=Math.min(POOL, regions.length), workers=[];
  for(let w=0; w<n; w++) workers.push(worker());
  await Promise.all(workers);
  if(gen===discGen) tick(true);   // 최종 확정 렌더
}
let discRows=[];    // 현재 구·평형의 계산 결과
let discShown=[];   // 정렬·TOP 적용된 렌더 대상 (관심추가 인덱스 참조)
let discGen=0;      // 조회 경합 가드
let discInited=false;

function setMode(mode, skipRun){
  currentMode=mode;
  const watch = mode==='watch';
  // 탭 전환 시 비슷한 단지 컨텍스트 해제 (openSimilar 는 이 함수 호출 뒤 다시 설정)
  if(discSimilar){
    discSimilar=null;
    const so=document.getElementById('disc-sort-similar'); if(so) so.hidden=true;
    if(discSort==='similar'){ discSort='avg'; const se=document.getElementById('disc-sort'); if(se) se.value='avg'; }
  }
  syncSimilarUI();
  document.getElementById('watch-view').style.display = watch?'':'none';
  document.getElementById('discover-view').style.display = watch?'none':'';
  document.querySelectorAll('.mode-btn').forEach(b=>{
    const on=b.dataset.mode===mode;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on?'true':'false');
  });
  // 발굴 모드에선 예산·추가(관심목록 전용) 숨김
  const bw=document.getElementById('budget-wrap'); if(bw) bw.style.display=watch?'':'none';
  const ab=document.querySelector('.btn-add'); if(ab) ab.style.display=watch?'':'none';
  if(!watch){
    if(!discInited){ initDiscover(); discInited=true; }
    if(!skipRun) runDiscover();   // enterSimilar 는 자체 runDiscover 하므로 중복 조회 방지
  }
}

function initDiscover(){
  const cityEl=document.getElementById('disc-city');
  cityEl.innerHTML=CITIES.map(c=>`<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  cityEl.value=discCity;
  updateDiscGu(discCity);
  // 기본 구: 동작구 (서울일 때)
  const guEl=document.getElementById('disc-gu');
  if([...guEl.options].some(o=>o.value===DISC_DEFAULT_GU)){ guEl.value=DISC_DEFAULT_GU; discGu=DISC_DEFAULT_GU; }
  document.getElementById('disc-sort').value=discSort;   // 기본 평단가순
  renderDiscPyeong();
}
function updateDiscGu(city){
  const guEl=document.getElementById('disc-gu');
  const filtered=REGIONS.filter(r=>r.city===city);
  guEl.innerHTML='<option value="ALL">전체</option>'+filtered.map(r=>`<option value="${r.code}">${escapeHtml(r.gu)}</option>`).join('');
  discGu=(filtered[0]||{}).code||'';   // 기본은 첫 구(호출측이 전체로 덮어쓸 수 있음)
  guEl.value=discGu;
}
function onDiscCityChange(){
  discCity=document.getElementById('disc-city').value;
  updateDiscGu(discCity);
  if(discSimilar){ discGu='ALL'; const ge=document.getElementById('disc-gu'); if(ge) ge.value='ALL'; }  // 비슷 모드는 시/도 바꿔도 전체 유지
  runDiscover();
}
function onDiscGuChange(){ discGu=document.getElementById('disc-gu').value; runDiscover(); }
function renderDiscPyeong(){
  const locked = !!discSimilar;   // 비슷 모드: 기준 평형으로 고정(나머지 비활성)
  document.getElementById('disc-pyeong').innerHTML=['10','20','30','40','50'].map(p=>{
    const active=p===discPyeong, dis=locked && !active;
    return `<button class="disc-pyeong-btn${active?' active':''}${dis?' locked':''}" aria-pressed="${active}"${dis?' disabled':''}${locked?` title="비슷 검색은 기준 평형(${PYEONG_DEFS[discPyeong].label})으로 고정돼요"`:''} onclick="setDiscPyeong('${p}')">${PYEONG_DEFS[p].label}</button>`;
  }).join('');
}
function setDiscPyeong(p){ if(discSimilar) return; discPyeong=p; renderDiscPyeong(); if(discGu==='ALL') runDiscover(); else computeAndRenderDiscover(); }

// ── 비슷한 가격대 단지 (발굴 뷰에 얹는 컨텍스트) ────────────────────
// 차트의 첫 선택 단지를 기준으로, 같은 구·평형에서 평단가 ±band% 단지를 추천.
// 필터(시/도·구/군·평형·정렬)는 발굴 뷰 그대로 재사용 — 목적만 다른 통일된 페이지.
// 통합 진입: 기준 단지(ref={name,dong,lawd,pyeong,avg})로 비슷한 평단가 찾기 시작.
// 차트 CTA·리스트 체크박스 모두 이 함수로 일원화. 구/군은 '전체'가 기본.
function enterSimilar(ref){
  if(!ref || !ref.lawd) return;
  const band = discSimilar ? discSimilar.band : 5;   // 직전 밴드 유지, 기본 ±5%
  const mode = discSimilar ? discSimilar.mode : 'avg';  // 매칭 축(평단가/총액) 유지
  setMode('discover', true);   // discSimilar 초기화됨 → 아래서 재설정 (자체 runDiscover)
  discSimilar={ name:ref.name, dong:ref.dong||'', lawd:ref.lawd, avg:Math.round(ref.avg||0), total:Math.round(ref.total||0), band:band, mode:mode };
  const region=REGIONS.find(r=>r.code===ref.lawd);
  if(region){ discCity=region.city; const ce=document.getElementById('disc-city'); if(ce) ce.value=discCity; updateDiscGu(discCity); }
  discGu='ALL';                                          // 구/군 전체가 기본
  const ge=document.getElementById('disc-gu'); if(ge) ge.value='ALL';
  if(ref.pyeong){ discPyeong=ref.pyeong; renderDiscPyeong(); }
  discSort='avg';   // 기본 평단가순. 상승률순은 관측 3개월↑만 남아 밴드와 겹치면 0건 → 선택지로만
  const so=document.getElementById('disc-sort-similar'); if(so) so.hidden=false;
  const se=document.getElementById('disc-sort'); if(se) se.value='avg';
  syncSimilarUI();
  runDiscover();
}
// 차트에서 진입
function openSimilar(){
  if(!selectedAptIds.length){ toast('차트에 단지를 먼저 선택하세요'); return; }
  const sel=selectedAptIds[0];
  const apt=apartments.find(a=>a.id===sel.aptId);
  if(!apt){ return; }
  const txsAll=(transactions[sel.aptId]||{})[sel.pyeong]||[];
  if(!txsAll.length){ toast('기준 단지의 거래가 없어요'); return; }
  // 후보(agg 최근 6개월)와 동일 기준으로 산출 → 총액이 옛 저가에 눌려 낮게 나오는 문제 방지
  const now=new Date();
  const cut=new Date(now.getFullYear(), now.getMonth()-(ALL_MONTHS-1), 1);
  const cutYm=''+cut.getFullYear()+String(cut.getMonth()+1).padStart(2,'0');
  let use=txsAll.filter(t=>(''+t.year+String(t.month).padStart(2,'0'))>=cutYm);
  if(!use.length) use=txsAll.slice(0,5);   // 최근 거래가 없으면 최근 5건
  const refAvg=avgPyeongPrice(use);
  if(!refAvg){ toast('기준 단지의 평단가를 계산할 수 없어요'); return; }
  const refTotal=Math.round(use.reduce((s,t)=>s+t.price,0)/use.length);   // 최근 평균 총액
  enterSimilar({ name:apt.aptName, dong:apt.dong||'', lawd:apt.lawdCd, pyeong:sel.pyeong, avg:refAvg, total:refTotal });
}
// 리스트 행 체크박스(매번 1개만) → 그 단지를 기준으로. 기준행 재클릭 시 해제.
function onSimCheck(idx){
  const row=discShown[idx];
  if(!row) return;
  const isRef=discSimilar && row.name===discSimilar.name && (row.dong||'')===(discSimilar.dong||'');
  if(isRef){ exitSimilar(); return; }
  enterSimilar({ name:row.name, dong:row.dong, lawd:row.lawd||discGu, pyeong:discPyeong, avg:row.avg, total:row.total||row.latest||0 });
}
function syncSimilarUI(){
  const bar=document.getElementById('similar-bar');
  if(!bar) return;
  if(!discSimilar){ bar.style.display='none'; bar.innerHTML=''; return; }
  bar.style.display='';
  const m=discSimilar.mode||'avg';
  bar.innerHTML=`
    <div class="similar-info"><span class="similar-badge">기준</span><b>${escapeHtml(discSimilar.name)}</b>${discSimilar.dong?` <span class="disc-dong">${escapeHtml(discSimilar.dong)}</span>`:''}</div>
    <div class="sim-axis" role="group" aria-label="매칭 기준">
      <button class="sim-axis-btn${m==='avg'?' on':''}" onclick="onSimModeChange('avg')">평단가 <b id="sim-ref-avg">${discSimilar.avg.toLocaleString()}만/평</b></button>
      <button class="sim-axis-btn${m==='total'?' on':''}" onclick="onSimModeChange('total')">총액 <b id="sim-ref-total">${formatPrice(discSimilar.total||0)}</b></button>
      <span class="sim-axis-pyeong" title="기준 평형(고정)">${PYEONG_DEFS[discPyeong]?PYEONG_DEFS[discPyeong].label:''}</span>
    </div>
    <div class="similar-ctrl">
      <label for="disc-band">±<b id="disc-band-val">${discSimilar.band}</b>%</label>
      <input type="range" id="disc-band" min="1" max="15" step="1" value="${discSimilar.band}" oninput="onBandInput(this.value)" aria-label="매칭 범위 퍼센트">
      <button class="btn-ghost" onclick="exitSimilar()">해제</button>
    </div>`;
}
// 매칭 축 전환(평단가 ↔ 총액)
function onSimModeChange(m){
  if(!discSimilar || discSimilar.mode===m) return;
  discSimilar.mode=m;
  syncSimilarUI();
  renderDiscover();
}
// 슬라이더 조절 → 즉시 재필터(클라이언트 계산, 재조회 없음)
function onBandInput(v){

function exitSimilar(){

async function runDiscover(){
  // 비슷 모드는 평단가만 필요 → 항상 agg(6개월, 빠름). 전체든 특정 구든.
  // 일반 발굴 전체(ALL)도 agg. 일반 발굴의 특정 구만 원시조회(상승률 랭킹 위해 전 기간).
  if(discSimilar || discGu==='ALL'){ return runDiscoverAll(); }
  if(!discGu) return;
  const resultsEl=document.getElementById('discover-results');
  const gen=++discGen;
  resultsEl.innerHTML=`<div class="card-loading"><span class="spinner"></span> 조회중...</div>`;
  document.getElementById('discover-note').textContent='';
  const dm=discPeriodM();
  const ck=`${discGu}_${dm}`;
  let regionAll=discCache[ck];
  if(!regionAll){
    try{
      const ymds=getLastNMonths(dm);
      const br=await fetchBatch(discGu, ymds);
      if(gen!==discGen) return;   // 더 최신 요청 있음 → 폐기
      regionAll=Object.values(br).flat().filter(Boolean);
      discCache[ck]=regionAll;
    }catch(e){
      if(gen!==discGen) return;
      resultsEl.innerHTML=`<div class="tx-no">조회 실패: ${escapeHtml(e.message)}</div>`;
      return;
    }
  }
  if(gen!==discGen) return;
  computeRegionAvg(discGu, regionAll);
  computeAndRenderDiscover();
}

// 단지 검색(단일 구)은 최근 window 로 제한 → 3년 원시조회 과부하 방지(랭킹엔 충분).
// 상위 기간 버튼이 6개월 이하면 그 값을, 그 이상이면 6개월로 캡.
function discPeriodM(){ return Math.min(currentPeriod, 6); }
function computeAndRenderDiscover(){
  const regionAll=discCache[`${discGu}_${discPeriodM()}`];
  if(!regionAll) return;
  const byKey={};   // 이름+법정동으로 그룹핑(동명 아파트 분리)
  regionAll.forEach(tx=>{ const k=aptGroupKey(tx.aptName, tx.dong); (byKey[k]=byKey[k]||[]).push(tx); });
  const rAvg=(regionAvg[discGu]||{})[discPyeong]||0;
  discRows=[];
  Object.keys(byKey).forEach(k=>{
    const grp=byKey[k];
    const bucket=bucketByPyeong(grp, discPyeong);
    if(bucket.length<3) return;   // 노이즈 방지: 기간 내 거래 3건 이상만
    const stats=calcStats(bucket);
    const avg=avgPyeongPrice(bucket);
    discRows.push({ name:grp[0].aptName, dong:grp[0].dong||'', latest:stats.latest.price, count:bucket.length,
      latestY:stats.latest.year, latestM:stats.latest.month,
      growth:growthRate(bucket), avg, total:Math.round(bucket.reduce((s,t)=>s+t.price,0)/bucket.length),
      regionDiff: rAvg>0?(avg-rAvg)/rAvg*100:null, isHigh:stats.isHigh });
  });
  renderDiscover();
}

// 한 행 렌더 (idx=discShown 내 위치, rank=표시순위)
function discRowHtml(r, idx, rank){
  const isRef = discSimilar && r.name===discSimilar.name && (r.dong||'')===(discSimilar.dong||'');
  const rlawd = r.lawd||discGu;
  const already = apartments.some(a=>a.lawdCd===rlawd && a.aptName===r.name && (a.dong||'')===(r.dong||'') && a.pyeongs.includes(discPyeong));
  const g=r.growth;
  const gTxt = g==null ? '-' : `${g>=0?'+':''}${g.toFixed(1)}%`;
  const gCls = g==null ? 'neu-color' : g>=0 ? 'up-color' : 'down-color';

  // 정렬 기준 지표를 오른쪽에 크게 강조 (라벨 포함)
  let primVal, primLbl, primCls='accent-color';
  const simMode = discSimilar ? (discSimilar.mode||'avg') : 'avg';
  if(discSort==='count'){ primVal=`${r.count}<span class="disc-unit">건</span>`; primLbl='거래량'; }
  else if(discSort==='growth'){ primVal=gTxt; primLbl='상승률'; primCls=gCls; }
  else if(discSort==='total'){ primVal=formatPrice(r.total||0); primLbl='평균 총액'; }
  else if(discSort==='avg'){ primVal=`${r.avg.toLocaleString()}<span class="disc-unit">만/평</span>`; primLbl='평단가'; }
  else if(simMode==='total'){ primVal=formatPrice(r.total||0); primLbl='평균 총액'; }   // 근접순 + 총액축
  else { primVal=`${r.avg.toLocaleString()}<span class="disc-unit">만/평</span>`; primLbl='평단가'; }

  // 메타: 정렬 기준 제외한 보조 지표만
  const rowMAgo=monthsSince(r.latestY, r.latestM);
  const rowStale=rowMAgo>=6?` <span class="stale-tag">${agoLabel(rowMAgo)}</span>`:'';
  const meta=[`최근 ${formatPrice(r.latest)}${rowStale}`];
  if(discGu==='ALL' && r.lawd){ const rg=REGIONS.find(x=>x.code===r.lawd); if(rg) meta.unshift(`<span class="accent-color">${escapeHtml(rg.gu)}</span>`); }   // 전체: 어느 구인지 표시
  if(discSort!=='count') meta.push(`${r.count}건`);
  if(discSort!=='avg') meta.push(`${r.avg.toLocaleString()}만/평`);
  if(discSort!=='growth' && g!=null) meta.push(`<span class="${gCls}">${gTxt}</span>`);
  if(r.regionDiff!=null) meta.push(`<span class="${r.regionDiff>=0?'up-color':'down-color'}">지역평균 ${r.regionDiff>=0?'+':''}${Math.round(r.regionDiff)}%</span>`);

  return `<div class="disc-row${isRef?' is-ref':''}">
    <div class="disc-rank">${isRef?'<span class="similar-badge">기준</span>':rank}</div>
    <div class="disc-main">
      <div class="disc-name">${escapeHtml(r.name)}${r.dong?` <span class="disc-dong">${escapeHtml(r.dong)}</span>`:''} ${r.isHigh?'<span class="hilo-badge hi">신고가</span>':''}</div>
      <div class="disc-meta">${meta.join(' · ')}</div>
    </div>
    <div class="disc-metric">
      <div class="disc-metric-val ${primCls}">${primVal}</div>
      <div class="disc-metric-lbl">${primLbl}</div>
    </div>
    <div class="disc-actions">
      <label class="disc-simsel${isRef?' on':''}" title="이 단지 기준으로 비슷한 평단가 찾기">
        <input type="checkbox" ${isRef?'checked':''} onchange="onSimCheck(${idx})">
        <span>비슷</span>
      </label>
      <button class="disc-add" ${already?'disabled':''} onclick="addFromDiscover(${idx})">${already?'추가됨':'＋관심'}</button>
    </div>
  </div>`;
}

function renderDiscover(progress){
  discSort=document.getElementById('disc-sort').value;
  const resultsEl=document.getElementById('discover-results');
  const noteEl=document.getElementById('discover-note');
  const region=REGIONS.find(r=>r.code===discGu);
  const regionName = discGu==='ALL' ? `${discCity} 전체` : (region?region.name:'');

  let rows=discRows.slice();
  // 비슷한 단지 모드: 기준 평단가 ±band% 로 필터 + 기준 단지는 상단 핀으로 분리
  let refRow=null;
  const simMode = discSimilar ? (discSimilar.mode||'avg') : 'avg';
  const refVal = discSimilar ? (simMode==='total' ? discSimilar.total : discSimilar.avg) : 0;
  const candVal = r => simMode==='total' ? (r.total||0) : r.avg;
  if(discSimilar){
    refRow=discRows.find(r=>r.name===discSimilar.name && (r.dong||'')===(discSimilar.dong||''));
    // 집계 데이터에 기준 단지가 있으면 평단가·총액을 동기화(밴드 비교 일관성)
    if(refRow){
      if(refRow.avg>0){ discSimilar.avg=refRow.avg; const ra=document.getElementById('sim-ref-avg'); if(ra) ra.textContent=discSimilar.avg.toLocaleString()+'만/평'; }
      if(refRow.total>0){ discSimilar.total=refRow.total; const rt=document.getElementById('sim-ref-total'); if(rt) rt.textContent=formatPrice(discSimilar.total); }
    }
    const rv = simMode==='total' ? discSimilar.total : discSimilar.avg;
    rows=rows.filter(r=>{
      if(refRow && r===refRow) return false;
      if(!rv) return false;
      return Math.abs(candVal(r)-rv)/rv*100 <= discSimilar.band;
    });
  }
  // 안전망: 밴드에 후보가 하나도 없으면(기준만 남음) 근접순으로 자동 표시 → 빈 화면 방지
  let relaxed=false;
  if(discSimilar && rows.length===0 && !progress){
    const rv = simMode==='total' ? discSimilar.total : discSimilar.avg;
    const pool=discRows.filter(r=>!(refRow && r===refRow) && candVal(r)>0);
    if(pool.length && rv){
      pool.sort((a,b)=>Math.abs(candVal(a)-rv)-Math.abs(candVal(b)-rv));
      rows=pool.slice(0,20); relaxed=true;
    }
  }
  if(!relaxed){
    if(discSort==='growth'){
      rows=rows.filter(r=>r.growth!=null);   // 추세 산출 가능(관측 3개월↑) 단지만
      rows.sort((a,b)=>b.growth-a.growth);
    } else if(discSort==='count'){
      rows.sort((a,b)=>b.count-a.count);
    } else if(discSort==='total'){
      rows.sort((a,b)=>(b.total||0)-(a.total||0));
    } else if(discSort==='similar' && discSimilar){
      const rv = simMode==='total' ? discSimilar.total : discSimilar.avg;
      rows.sort((a,b)=>Math.abs(candVal(a)-rv)-Math.abs(candVal(b)-rv));   // 기준에 가까운 순
    } else {
      rows.sort((a,b)=>b.avg-a.avg);
    }
  }
  discShown=(refRow?[refRow]:[]).concat(rows.slice(0,40));
  const prog = progress ? ` · ${progress}` : '';
  if(discSimilar){
    const axis = simMode==='total' ? `총액 ${formatPrice(discSimilar.total||0)}` : `평단가 ${discSimilar.avg.toLocaleString()}만/평`;
    const sortTxt = discSort==='growth' ? '· 상승률순' : discSort==='avg' ? '· 평단가순' : discSort==='total' ? '· 총액순' : discSort==='similar' ? '· 근접순' : '';
    noteEl.textContent = relaxed
      ? `${discSimilar.name} 기준 ${axis} · ±${discSimilar.band}% 범위엔 없어 근접순 ${rows.length}곳 표시 · ${regionName} ${PYEONG_DEFS[discPyeong].label}${prog}`
      : `${discSimilar.name} 기준 ${axis} ±${discSimilar.band}% · ${regionName} ${PYEONG_DEFS[discPyeong].label} · 비슷한 단지 ${rows.length}곳 ${sortTxt}${prog}`;
  } else {
    const sortNote = discSort==='growth' ? '상승률 = 월별 중앙값 평단가 추세선(회귀, 관측 3개월↑)'
      : discSort==='count' ? '거래량순' : '평단가순';
    const per = discGu==='ALL' ? `최근 ${ALL_MONTHS}개월` : `최근 ${periodLabel(discPeriodM())}`;
    noteEl.textContent=`${regionName} · ${PYEONG_DEFS[discPyeong].label} · ${per} · ${rows.length}개 단지(거래 3건↑) · ${sortNote}${prog}`;
  }
  if(!discShown.length){
    if(progress){ return; }   // 아직 수집 중이면 '없음' 대신 기존 로딩 유지
    const msg = discSimilar
      ? `±${discSimilar.band}% 범위에 비슷한 가격대 단지가 없어요.<br>슬라이더로 범위를 넓히거나 평형을 바꿔보세요.`
      : (discSort==='growth'
        ? '이 조건에 맞는 단지가 없어요 (관측 3개월 이상 거래 필요).<br>다른 평형·구를 선택하거나 기간을 늘려보세요.'
        : '조건에 맞는 단지가 없어요 (기간 내 거래 3건 이상 필요).');
    resultsEl.innerHTML=`<div class="tx-no">${msg}</div>`;
    return;
  }
  const hasRef=!!refRow;
  resultsEl.innerHTML=discShown.map((r,i)=>discRowHtml(r, i, hasRef?i:i+1)).join('');
}

async function addFromDiscover(idx){
  const row=discShown[idx];
  if(!row) return;
  if(apartments.length>=10){ toast('⚠ 아파트는 최대 10개까지 추가할 수 있어요', 3500); return; }
  const rlawd=row.lawd||discGu;
  const region=REGIONS.find(r=>r.code===rlawd);
  if(!region){ toast('⚠ 지역 정보 없음'); return; }
  if(apartments.some(a=>a.lawdCd===rlawd && a.aptName===row.name && (a.dong||'')===(row.dong||'') && a.pyeongs.includes(discPyeong))){
    toast('⚠ 이미 추가된 아파트·평형이에요', 3000); return;
  }
  let regionAll=discCache[`${rlawd}_${currentPeriod}`];
  if(!regionAll){
    // 전체 검색 결과 등 원시데이터가 없으면 해당 구 조회 후 커밋
    toast('불러오는 중…', 1500);
    try{
      const br=await fetchBatch(rlawd, getLastNMonths(currentPeriod));
      regionAll=Object.values(br).flat().filter(Boolean);
      discCache[`${rlawd}_${currentPeriod}`]=regionAll;
      computeRegionAvg(rlawd, regionAll);
    }catch(e){ toast('⚠ 추가 실패(조회 오류)'); return; }
  }
  const apt=commitApt(region, row.name, row.dong, [discPyeong], regionAll);
  if(!apt){ toast('⚠ 추가 실패'); return; }
  renderGrid();
  toast(`✅ ${row.name} 관심목록 추가!`);
  renderDiscover();   // 버튼 '추가됨' 상태 갱신
}

function getSeriesColorIdx(aptId, pyeong) {

function selectCard(aptId, pyeong) {
  const existIdx = getSeriesColorIdx(aptId, pyeong);

    selectedAptIds.splice(existIdx, 1);

      selectedAptIds.shift();

    selectedAptIds.push({ aptId, pyeong });
  }

  // 카드 하이라이트 초기화
  document.querySelectorAll('.apt-card').forEach(c => {
    c.classList.remove('selected-a','selected-b','selected-c','selected-d','selected-e');
  });
  selectedAptIds.forEach((s, i) => {
    const card = document.getElementById(`card-${s.aptId}-${s.pyeong}`);
    if (card) card.classList.add(CHART_COLORS[i].cls);
  });

  // 패널 업데이트
  if (!selectedAptIds.length) {
    document.getElementById('chart-empty').style.display = 'flex';

    const tlc = document.getElementById('tx-list-count');

    return;

  document.getElementById('chart-empty').style.display = 'none';
  document.getElementById('chart-content').style.display = 'flex';

  // 헤더 텍스트 — 단지명을 각 차트 선 색상으로
  const nameColor = {};
  selectedAptIds.forEach((sel, i) => {

    if (apt && apt.aptName && !(apt.aptName in nameColor)) nameColor[apt.aptName] = CHART_COLORS[i % CHART_COLORS.length].line;
  });

    .map(n => `<span style="color:${nameColor[n]}">${escapeHtml(n)}</span>`)
    .join('<span style="color:var(--muted);font-weight:400"> vs </span>');

  const hint = document.getElementById('compare-hint');

  // 탭 없음 - 모든 apt+평형 조합을 동시에 표시

  renderChart();
}

// 뷰포트 폭 변화(회전·창크기) 시 차트 재렌더 — SVG 는 렌더 시점 clientWidth 기준이라
// 폭이 커지면 레터박스(빈 여백)가 생김. 재렌더로 항상 꽉 차게.
var _chartResizeTimer=null;
window.addEventListener('resize', function(){
  clearTimeout(_chartResizeTimer);
  _chartResizeTimer=setTimeout(function(){ if(typeof selectedAptIds!=='undefined' && selectedAptIds.length) renderChart(); }, 160);
});

function renderChart() {
  const wrap = document.getElementById('chart-svg-wrap');
  const legendBar = document.getElementById('chart-legend-bar');
  if (!selectedAptIds.length) return;
  const T = chartTheme();   // 현재 테마의 차트 색
  const PAL = CHART_COLORS.map((c,i)=>({line:T.s[i], area:c.area, cls:c.cls}));

  // apt+pyeong 조합별 시리즈 (선택 순서대로 색상 부여)
  const series = selectedAptIds.map((sel, i) => {
    const apt = apartments.find(a => a.id === sel.aptId);
    const txMap = transactions[sel.aptId] || {};
    const txs = (txMap[sel.pyeong] || []).slice().reverse();
    // 같은 아파트가 여러 개면 라벨에 평형 포함
    const sameAptCount = selectedAptIds.filter(s => s.aptId === sel.aptId).length;
    return {
      id: sel.aptId, apt, pyeong: sel.pyeong, txs,
      color: PAL[i % PAL.length],
      dashed: false,
      label: escapeHtml(sameAptCount > 1 || selectedAptIds.some(s => s.aptId !== sel.aptId && apartments.find(a=>a.id===s.aptId)?.aptName === apt?.aptName)
        ? `${apt?.aptName}${apt?.dong?' '+apt.dong:''} ${PYEONG_DEFS[sel.pyeong]?.label||''}`.trim()
        : apt?.aptName || ''),
    };
  });

  // 구 평균 추이 시리즈 (선택 단지의 구+평형별 월평균) — 회색 벤치마크 + 지역명 라벨
  if (showRegionAvg) {
    const seen = new Set(); let avgIdx = 0;
    selectedAptIds.forEach((sel) => {
      const apt = apartments.find(a => a.id === sel.aptId);
      if (!apt) return;
      const key = apt.lawdCd + '_' + sel.pyeong;
      if (seen.has(key)) return; seen.add(key);
      const avgTxs = regionMonthlyAvg(apt.lawdCd, sel.pyeong);
      if (avgTxs.length >= 2) {
        const gu = (apt.regionName || '').split(' ').pop();
        const guColor = T.a[avgIdx % T.a.length];   // 구 평균 전용 팔레트(구별 색상)
        avgIdx++;
        series.push({
          id: 'avg_' + key, apt: null, pyeong: sel.pyeong, txs: avgTxs, isAvg: true,
          color: { line: guColor, area: 'transparent' }, dashed: false,
          label: `${gu} ${PYEONG_DEFS[sel.pyeong]?.label || ''} 평균`,
          endLabel: `${gu} 평균`
        });
      }
    });
  }

  const allTxs = series.flatMap(s => s.txs);
  if (!allTxs.length) {
    wrap.innerHTML = `<div style="height:240px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px">선택한 평형의 거래 내역 없음</div>`;
    legendBar.innerHTML = '';
    return;
  }

  // 전체 날짜 범위 계산 (3개월 고정)
  const now = new Date();
  const startDate = new Date(now.getFullYear(), now.getMonth()-(currentPeriod-1), 1);
  const endDate = now;
  const totalDays = Math.max((endDate - startDate) / 86400000, 1);

  function dateToX(tx, cw, padL) {
    const d = new Date(+tx.year, +tx.month-1, +tx.day);
    const ratio = Math.max(0, Math.min(1, (d - startDate) / (endDate - startDate)));
    return padL + ratio * cw;
  }

  // 전체 가격 범위
  const allPrices = allTxs.map(t=>t.price);
  const globalMax = Math.max(...allPrices);
  const globalMin = Math.min(...allPrices);
  const priceRange = globalMax - globalMin || globalMax * 0.05 || 1;
  // 여백 15% (격차 강조)
  const yMin = globalMin - priceRange * 0.15;
  const yMax = globalMax + priceRange * 0.15;
  const yRange = yMax - yMin;

  // 폭·높이를 실측해 영역을 꽉 채운다(레터박스 방지). 레이아웃 전이면 다음 프레임에 재시도.
  let W = Math.round(wrap.clientWidth), H = Math.round(wrap.clientHeight);
  if (W < 80) {
    if (!renderChart._retry) { renderChart._retry = true; requestAnimationFrame(function(){ renderChart._retry=false; renderChart(); }); }
    return;
  }
  if (H < 240) H = 340;   // 안전 최소 높이
  const narrow = W < 480;
  const seriesCount = series.filter(s=>s.txs.length).length;
  const topPad = (narrow?22:32) + Math.max(0, seriesCount) * (narrow?18:22); // 시리즈당 라벨 공간
  const pad = {t:topPad, r:narrow?14:24, b:narrow?40:48, l:narrow?56:84};
  const cw = W - pad.l - pad.r, ch = H - pad.t - pad.b;

  function priceToY(price) {
    return pad.t + ch - ((price - yMin) / yRange * ch);
  }

  // 그리드 & Y축
  const gridCount = 7;
  const gridLines = Array.from({length:gridCount}, (_,i) => {
    const r = i/(gridCount-1);
    const price = yMin + yRange * r;
    const y = pad.t + ch - r*ch;
    return `
      <line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${W-pad.r}" y2="${y.toFixed(1)}" stroke="${T.grid}" stroke-width="1" stroke-dasharray="${i===0?'none':'4,3'}"/>
      <text x="${pad.l-6}" y="${(y+4).toFixed(1)}" text-anchor="end" fill="${T.axis}" font-size="11" font-family="IBM Plex Mono">${formatPrice(Math.round(price))}</text>`;
  }).join('');

  // X축: 기간에 따라 적절한 눈금 생성
  const xAxisLabels = [];
  {
    // 눈금 간격: 차트 폭에 맞춰 목표 눈금 수로 자동 산출(모바일은 적게 → 라벨 겹침 방지)
    const targetTicks = W < 420 ? 4 : W < 700 ? 6 : 9;
    const intervalMonths = Math.max(1, Math.ceil(currentPeriod / targetTicks));

    // startDate의 다음 달 1일부터 시작
    let cursor = new Date(startDate.getFullYear(), startDate.getMonth() + 1, 1);
    const seen = new Set();

    while (cursor <= endDate) {
      const key = `${cursor.getFullYear()}-${cursor.getMonth()}`;
      if (!seen.has(key)) {
        seen.add(key);
        const ratio = Math.max(0, Math.min(1, (cursor - startDate) / (endDate - startDate)));
        const x = pad.l + ratio * cw;
        const yr = cursor.getFullYear();
        const mo = cursor.getMonth() + 1;
        // 연도(2자리) + 월 항상 표기 → 가로축에서 연도가 늘 보임. 연초(1월) 강조.
        const label = `${String(yr).slice(2)}.${mo}`;
        const isBold = mo === 1;
        xAxisLabels.push(`<text x="${x.toFixed(1)}" y="${H-6}" text-anchor="middle"
          fill="${isBold ? T.axisS : T.axis}" font-size="${isBold ? 10 : 10}"
          font-weight="${isBold ? '600' : '400'}">${label}</text>`);
        xAxisLabels.push(`<line x1="${x.toFixed(1)}" y1="${pad.t}" x2="${x.toFixed(1)}" y2="${(pad.t+ch).toFixed(1)}"
          stroke="${isBold ? T.gridS : T.grid}" stroke-width="1" stroke-dasharray="4,3"/>`);
      }
      // 다음 눈금
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + intervalMonths, 1);
    }
  }

  // 각 시리즈 SVG 생성
  const defs = [];
  const paths = [];
  const dots = [];
  const trendLines = [];  // 회귀 추세선(깜빡임)
  const avgLabels = [];   // 평균선 지역명 라벨
  const maxLabels = [];  // 최고가 라벨

  series.forEach((s, si) => {
    if (!s.txs.length) return;
    const c = s.color;
    const gradId = `grad${si}`;
    defs.push(`
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${c.line}" stop-opacity="0.3"/>
        <stop offset="100%" stop-color="${c.line}" stop-opacity="0"/>
      </linearGradient>`);

    const pts = s.txs.map(tx => ({
      x: dateToX(tx, cw, pad.l),
      y: priceToY(tx.price),
      tx,
    }));

    const linePath = pts.map((p,i)=>`${i===0?'M':'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const areaPath = pts.length > 1
      ? `${linePath} L${pts[pts.length-1].x.toFixed(1)},${(pad.t+ch).toFixed(1)} L${pts[0].x.toFixed(1)},${(pad.t+ch).toFixed(1)} Z`
      : '';

    if (s.isAvg) {
      // 구 평균: 라인방식과 구별되는 '영역' 스타일 — 굵은 반투명 밴드 + 얇은 점선 중심선(구별 색상)
      paths.push(`<path d="${linePath}" fill="none" stroke="${c.line}" stroke-width="${narrow?8:11}" opacity="0.18" stroke-linejoin="round" stroke-linecap="round"/>`);
      paths.push(`<path d="${linePath}" fill="none" stroke="${c.line}" stroke-width="1.6" opacity="0.9" stroke-dasharray="1,5" stroke-linecap="round"/>`);
    } else {
      if (areaPath && s.color.area !== 'transparent') paths.push(`<path d="${areaPath}" fill="url(#${gradId})"/>`);
      paths.push(`<path d="${linePath}" fill="none" stroke="${c.line}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"${s.dashed ? ' stroke-dasharray="6,4"' : ''}/>`);
    }

    // 평균선 지역명 라벨(선 오른쪽 끝)
    if (s.isAvg && pts.length) {
      const lp = pts[pts.length - 1];
      avgLabels.push(`<text x="${(lp.x - 4).toFixed(1)}" y="${(lp.y - 6).toFixed(1)}" text-anchor="end" fill="${c.line}" font-size="10" font-weight="700" font-family="'Noto Sans KR',sans-serif" style="paint-order:stroke" stroke="${T.halo}" stroke-width="3">${escapeHtml(s.endLabel)}</text>`);
    }

    // ── 추세선: LOESS 국소가중회귀 스무딩 곡선(데이터 굴곡 반영) + 넷 방향 배지 ──
    if (pts.length >= 2 && !s.isAvg) {   // 구 평균 시리즈는 자체가 평균선이라 추세선 생략
      const fit = linreg(pts.map(p => ({ x: p.x, y: p.tx.price })));
      if (fit) {
        const xsArr = pts.map(p => p.x);
        const xMin = Math.min(...xsArr), xMax = Math.max(...xsArr);
        const pStart = fit.intercept + fit.slope * xMin;
        const pEnd = fit.intercept + fit.slope * xMax;
        // 배지(상승/횡보/하락 %)는 전체 회귀 기준의 '넷 추세'로 안정적으로 산출
        const pct = pStart > 0 ? (pEnd - pStart) / pStart * 100 : 0;
        const cls = Math.abs(pct) < 3 ? 'flat' : pct > 0 ? 'up' : 'down';
        s.trend = { pct, cls, label: cls === 'flat' ? '횡보' : cls === 'up' ? '상승세' : '하락세' };
        // 그려지는 곡선은 LOESS: 점이 적을수록 창을 넓혀(과적합 방지) 매끈하게
        const span = pts.length <= 6 ? 0.9 : pts.length <= 12 ? 0.65 : 0.5;
        const sm = loess(pts.map(p => ({ x: p.x, y: p.tx.price })), span, 44);
        const tPath = (sm && sm.length >= 2)
          ? sm.map((q, qi) => `${qi === 0 ? 'M' : 'L'}${q.x.toFixed(1)},${priceToY(q.y).toFixed(1)}`).join(' ')
          : `M${xMin.toFixed(1)},${priceToY(pStart).toFixed(1)} L${xMax.toFixed(1)},${priceToY(pEnd).toFixed(1)}`;
        trendLines.push(`<path class="trend-line${trendOnly?' vivid':''}" d="${tPath}" fill="none" stroke="${c.line}" stroke-width="${trendOnly?'4':'2.4'}" stroke-dasharray="${trendOnly?'0.1,5':'0.1,7'}" stroke-linecap="round" stroke-linejoin="round" filter="url(#trendGlow)"/>`);
      }
    }

    // 최고가 포인트 찾기
    const maxPt = pts.reduce((best, p) => p.tx.price > best.tx.price ? p : best, pts[0]);

    if (!s.isAvg) pts.forEach(p => {   // 구 평균선은 점 없이 매끈하게
      const isMax = p === maxPt;
      // 거래 점 강조: 라인은 얇게, 점은 크고 또렷하게(배경색 링으로 분리)
      dots.push(`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}"
        r="${isMax ? 4.5 : pts.length===1 ? 4 : 3}"
        fill="${c.line}" stroke="${isMax ? T.crosshair : T.halo}" stroke-width="${isMax ? 2 : 1.5}"
        class="chart-dot" data-series="${si}" data-idx="${pts.indexOf(p)}"/>`);
    });

    // 최고가 라벨: 그래프 영역 완전 밖 상단에 고정 배치 (구 평균 제외)
    if (!s.isAvg) {
    const lx = maxPt.x;
    const ly = maxPt.y;
    const labelText = formatPrice(maxPt.tx.price);
    // 라벨: [아파트명 : 최고 25억] 형태
    const labelText2 = formatPrice(maxPt.tx.price);
    const aptShort = escapeHtml(s.apt?.aptName || '');
    const labelTag = series.length > 1
      ? `${aptShort} : 최고 ${labelText2}`
      : `최고 ${labelText2}`;
    // 한국어 포함 → 글자당 약 8.5px
    const labelW = Math.min(labelTag.length * 8.5 + 16, 200);
    // X 경계 안에 맞추기
    const rawLX = lx - labelW / 2;
    const clampedLX = Math.max(pad.l, Math.min(W - pad.r - labelW, rawLX));
    // Y: 항상 그래프 상단(pad.t) 위에 고정 — 시리즈별로 12px씩 내려서 겹침 방지
    const labelBandY = -28 - (si * 20);

    maxLabels.push(`
      <g>
        <!-- 최고가 포인트 → 상단 라벨로 이어지는 점선 -->
        <line x1="${lx.toFixed(1)}" y1="${ly.toFixed(1)}"
              x2="${lx.toFixed(1)}" y2="${pad.t}"
              stroke="${c.line}" stroke-width="1" stroke-dasharray="3,3" opacity="0.45"/>
        <!-- 라벨 배경 -->
        <rect x="${clampedLX.toFixed(1)}" y="${(pad.t + labelBandY - 2).toFixed(1)}"
              width="${labelW}" height="18" rx="5"
              fill="${c.line}" opacity="0.18"/>
        <rect x="${clampedLX.toFixed(1)}" y="${(pad.t + labelBandY - 2).toFixed(1)}"
              width="${labelW}" height="18" rx="5"
              fill="none" stroke="${c.line}" stroke-width="1" opacity="0.6"/>
        <!-- 라벨 텍스트 -->
        <text x="${(clampedLX + labelW/2).toFixed(1)}" y="${(pad.t + labelBandY + 11).toFixed(1)}"
              text-anchor="middle" fill="${c.line}"
              font-size="10" font-family="IBM Plex Mono" font-weight="700"
              letter-spacing="0.3">${labelTag}</text>
      </g>`);
    }
  });

  // 예산 수평선
  let budgetLineEl = '';
  const budgetChk = document.getElementById('budget-check');
  const budgetVal = parseFloat(document.getElementById('budget-input')?.value);
  if (budgetChk?.checked && !isNaN(budgetVal) && budgetVal > 0) {
    const budgetManwon = budgetVal * 10000;
    const rawBy = priceToY(budgetManwon);
    // 범위 밖이면 숨기지 말고 가장자리로 클램프 + ▲(위)/▼(아래) 표시
    const off = rawBy < pad.t ? '▲' : rawBy > pad.t + ch ? '▼' : '';
    const by = Math.max(pad.t, Math.min(pad.t + ch, rawBy));
    budgetLineEl = `
      <line x1="${pad.l}" y1="${by.toFixed(1)}" x2="${(W-pad.r).toFixed(1)}" y2="${by.toFixed(1)}"
        stroke="${T.budget}" stroke-width="1.5" stroke-dasharray="8,4" opacity="${off ? '0.45' : '0.8'}"/>
      <rect x="${(W-pad.r+4).toFixed(1)}" y="${(by-9).toFixed(1)}" width="48" height="18" rx="4"
        fill="${T.budget}" opacity="0.15"/>
      <rect x="${(W-pad.r+4).toFixed(1)}" y="${(by-9).toFixed(1)}" width="48" height="18" rx="4"
        fill="none" stroke="${T.budget}" stroke-width="1" opacity="0.6"/>
      <text x="${(W-pad.r+28).toFixed(1)}" y="${(by+4).toFixed(1)}"
        text-anchor="middle" fill="${T.budget}" font-size="9" font-family="IBM Plex Mono" font-weight="700">
        ${off}${budgetVal}억
      </text>`;
  }

  // crosshair용 데이터 전역 저장
  window._chartData = {
    padL: pad.l, padT: pad.t, ch, W,
    series: series.map(s => ({
      label: s.label,
      color: s.color.line,
      pts: s.txs.map(tx => ({
        x: dateToX(tx, cw, pad.l),
        price: tx.price,
        floor: tx.floor,
        date: fmtDate(tx.year, tx.month, tx.day),
      }))
    }))
  };

  wrap.innerHTML = `
    <svg width="100%" height="${H}" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;display:block">
      <defs>${defs.join('')}<filter id="trendGlow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
      ${gridLines}
      ${xAxisLabels.join('')}
      <line x1="${pad.l}" y1="${pad.t}" x2="${pad.l}" y2="${(pad.t+ch).toFixed(1)}" stroke="${T.frame}" stroke-width="1"/>
      <line x1="${pad.l}" y1="${(pad.t+ch).toFixed(1)}" x2="${(W-pad.r).toFixed(1)}" y2="${(pad.t+ch).toFixed(1)}" stroke="${T.frame}" stroke-width="1"/>
      <g style="transition:opacity .25s" opacity="${trendOnly ? '0.12' : '1'}">
        ${paths.join('')}
        ${dots.join('')}
        ${avgLabels.join('')}
        ${maxLabels.join('')}
        ${budgetLineEl}
      </g>
      ${trendLines.join('')}
      <!-- crosshair 수직선 -->
      <line id="chart-crosshair-line" x1="0" y1="${pad.t}" x2="0" y2="${(pad.t+ch).toFixed(1)}"
        stroke="${T.crosshair}" stroke-width="1" stroke-dasharray="4,3" opacity="0"
        style="pointer-events:none;transition:opacity .1s"/>
      <!-- 마우스 오버레이 (전체 차트 영역) -->
      <rect x="${pad.l}" y="${pad.t}" width="${cw}" height="${ch}"
        fill="transparent" id="chart-overlay"
        onmousemove="onChartMouseMove(event)"
        onmouseleave="onChartMouseLeave()"
        ontouchstart="onChartTouch(event)"
        ontouchmove="onChartTouch(event)"
        ontouchend="onChartTouchEnd()"/>
    </svg>
    <div id="chart-crosshair-tip" style="position:fixed;display:none;background:var(--c-tip-bg);border:1px solid var(--border2);border-radius:10px;padding:10px 14px;font-size:12px;color:var(--text);pointer-events:none;z-index:999;font-family:'Noto Sans KR',sans-serif;box-shadow:0 4px 20px rgba(0,0,0,.6);min-width:160px;"></div>
    <div id="chart-tooltip" style="display:none"></div>`;

  // 레전드 렌더 (색상 + 아파트명만)
  legendBar.innerHTML = series
    .filter(s => s.apt || s.isAvg)
    .map(s => `
      <div class="chart-legend-item">
        <span class="chart-legend-dot" style="${s.isAvg ? `width:20px;height:7px;border-radius:4px;background:${s.color.line};opacity:0.5` : `background:${s.color.line};${s.dashed ? 'outline:2px dashed '+s.color.line+';background:transparent;outline-offset:-2px' : ''}`}"></span>
        <span style="${s.isAvg ? 'opacity:0.85;font-style:italic' : ''}">${s.label}</span>
        ${s.trend ? `<span class="trend-tag ${s.trend.cls}">${s.trend.label} ${s.trend.pct>=0?'+':''}${s.trend.pct.toFixed(0)}%</span>` : ''}
        ${!s.txs.length ? '<span style="font-size:10px;color:var(--muted);font-weight:400">(거래없음)</span>' : ''}
      </div>`).join('');

  // 거래 목록 렌더 (구 평균 제외 — 실제 거래만)
  renderTxList(series.filter(s => !s.isAvg));
}

function renderTxList(series) {
  const body = document.getElementById('tx-list-body');
  const countEl = document.getElementById('tx-list-count');
  if (!body) return;

  // 전체 거래 합산 (label 포함), 날짜 내림차순
  const allItems = series.flatMap(s =>
    s.txs.map(tx => ({ tx, color: s.color, label: s.label }))
  ).sort((a, b) =>
    `${b.tx.year}${b.tx.month}${b.tx.day}`.localeCompare(`${a.tx.year}${a.tx.month}${a.tx.day}`)
  );

  const isMulti = series.filter(s => s.txs.length > 0).length > 1;
  countEl.textContent = `총 ${allItems.length}건`;

  if (!allItems.length) {
    body.innerHTML = '<div style="padding:24px;text-align:center;font-size:13px;color:var(--muted)">선택한 기간 내 거래 내역 없음</div>';
    return;
  }

  body.innerHTML = allItems.map(({ tx, color, label }) => `
    <div class="tx-item">
      <div class="tx-item-bar" style="background:${isMulti ? color.line : 'transparent'}"></div>
      <div class="tx-item-info">
        <div class="tx-item-name" style="color:${isMulti ? color.line : 'var(--text)'}">
          ${isMulti ? label : `${tx.floor}층${floorBadge(tx.floor)}`}
        </div>
        <div class="tx-item-meta">${fmtDate(tx.year, tx.month, tx.day)}${isMulti?` · ${tx.floor}층${floorBadge(tx.floor)}`:''}</div>
      </div>
      <div class="tx-item-price" style="color:${isMulti ? color.line : 'var(--text)'}">
        ${formatPrice(tx.price)}
      </div>
    </div>`).join('');
}

function showChartTooltip() {} // 기존 호환용
function hideChartTooltip() {}

function onChartMouseMove(e) {
  const cd = window._chartData;
  if(!cd) return;

  const overlay = document.getElementById('chart-overlay');
  if(!overlay) return;
  const svgRect = overlay.closest('svg').getBoundingClientRect();
  // SVG viewBox 스케일 보정
  const svgEl = overlay.closest('svg');
  const scaleX = cd.W / svgRect.width;
  const mouseX = (e.clientX - svgRect.left) * scaleX;

  // crosshair 선
  const line = document.getElementById('chart-crosshair-line');
  if(line){ line.setAttribute('x1', mouseX); line.setAttribute('x2', mouseX); line.setAttribute('opacity','0.5'); }

  const tip = document.getElementById('chart-crosshair-tip');
  if(!tip) return;

  const SNAP = 30;
  const rows = [];
  let closestDate = '';
  let closestDist = Infinity;

  cd.series.forEach(s => {
    if(!s.pts.length) return;
    let best = null, bestDist = Infinity;
    s.pts.forEach(pt => {
      const d = Math.abs(pt.x - mouseX);
      if(d < bestDist){ bestDist = d; best = pt; }
    });
    if(best && bestDist < SNAP){
      rows.push({ color: s.color, label: s.label, price: best.price, date: best.date, dist: bestDist });
      if(bestDist < closestDist){ closestDist = bestDist; closestDate = best.date; }
    }
  });

  if(!rows.length){ tip.style.display='none'; return; }

  // 가격 내림차순 정렬
  rows.sort((a,b) => b.price - a.price);

  tip.innerHTML = '<div style="font-size:10px;color:var(--c-axis);margin-bottom:7px;font-family:IBM Plex Mono,monospace">' + closestDate + '</div>'
    + rows.map((r, i) => '<div style="display:flex;align-items:center;gap:8px;padding:3px 0;' + (i < rows.length-1 ? 'border-bottom:1px solid var(--border)' : '') + '">'
      + '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + r.color + ';flex-shrink:0"></span>'
      + '<span style="flex:1;font-size:11px;color:var(--c-tip-sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:120px">' + r.label + '</span>'
      + '<span style="font-family:IBM Plex Mono,monospace;font-size:12px;font-weight:700;color:var(--text);margin-left:8px">' + formatPrice(r.price) + '</span>'
      + '</div>').join('');

  tip.style.display = 'block';
  const tipX = e.clientX + 16;
  const tipY = e.clientY - tip.offsetHeight / 2;
  tip.style.left = Math.min(tipX, window.innerWidth - tip.offsetWidth - 10) + 'px';
  tip.style.top = Math.max(10, tipY) + 'px';
}

function onChartMouseLeave() {
  const line = document.getElementById('chart-crosshair-line');
  if(line) line.setAttribute('opacity','0');
  const tip = document.getElementById('chart-crosshair-tip');
  if(tip) tip.style.display = 'none';
}
// 터치 기기: hover 가 없어 실거래 툴팁을 못 봄 → 탭·드래그로 조회. 스크롤은 유지(preventDefault 안 함).
var _chartHideTimer=null;
function onChartTouch(e){
  if(!e.touches || !e.touches.length) return;
  clearTimeout(_chartHideTimer);
  const t=e.touches[0];
  onChartMouseMove({clientX:t.clientX, clientY:t.clientY});
}
function onChartTouchEnd(){
  clearTimeout(_chartHideTimer);
  _chartHideTimer=setTimeout(onChartMouseLeave, 2200);   // 잠깐 남겨 읽게 한 뒤 정리
}

function markRead(aptId) {
  if (!newCounts[aptId]) return;
  newCounts[aptId] = 0;
  const allTxs = Object.values(transactions[aptId] || {}).flat();
  lastSeen[aptId] = new Set(allTxs.map(t => t.id));
  saveSeen();
  renderGrid();   // 배지 갱신 (선택 하이라이트는 selectedAptIds 로 재적용됨)
}

function removeApt(aptId) {
  apartments=apartments.filter(a=>a.id!==aptId);delete transactions[aptId];delete newCounts[aptId];delete lastSeen[aptId];
  // 상세 시트가 이 아파트로 열려 있으면 닫기(삭제 후 빈/오래된 내용 방지)
  if(detailAptId===aptId){ detailAptId=null; closeModal('detail-sheet'); }
  const hadSel = selectedAptIds.some(s => s.aptId === aptId);
  selectedAptIds = selectedAptIds.filter(s => s.aptId !== aptId);
  if(hadSel){
    document.querySelectorAll('.apt-card').forEach(c=>c.classList.remove('selected-a','selected-b','selected-c','selected-d','selected-e'));
    selectedAptIds.forEach((s,i)=>{
      const card=document.getElementById(`card-${s.aptId}-${s.pyeong}`);
      if(card) card.classList.add(CHART_COLORS[i].cls);
    });
    if(!selectedAptIds.length){
      document.getElementById('chart-empty').style.display='flex';
      document.getElementById('chart-content').style.display='none';
    } else {
      renderChart();
    }
  }
  saveApts();saveSeen();renderGrid();
}

function openDetail(aptId){
  const apt=apartments.find(a=>a.id===aptId);if(!apt)return;
  detailAptId=aptId;
  if((newCounts[aptId]||0)>0){
    newCounts[aptId]=0;
    const allTxs=Object.values(transactions[aptId]||{}).flat();
    lastSeen[aptId]=new Set(allTxs.map(t=>t.id));saveSeen();renderGrid();
  }
  document.getElementById('sheet-title').textContent=apt.aptName;
  document.getElementById('sheet-sub').textContent=`${apt.regionName}${apt.dong?' '+apt.dong:''} · 최근 ${periodLabel(currentPeriod)} 실거래`;
  document.getElementById('detail-tabs').innerHTML=apt.pyeongs.map(p=>
    `<button class="detail-tab${p===apt.pyeongs[0]?' active':''}" onclick="switchDetailTab('${p}',this)">${PYEONG_DEFS[p].label}</button>`
  ).join('');
  detailActivePyeong=apt.pyeongs[0];
  renderDetailBody(aptId,detailActivePyeong);
  openModal('detail-sheet');
}
function switchDetailTab(p,btn){
  document.querySelectorAll('.detail-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');detailActivePyeong=p;renderDetailBody(detailAptId,p);
}
function renderDetailBody(aptId,p){
  const apt=apartments.find(a=>a.id===aptId);
  const txs=(transactions[aptId]||{})[p]||[];
  const body=document.getElementById('sheet-body');
  if(!txs.length){body.innerHTML='<div class="tx-no">조회된 거래 내역이 없습니다</div>';return;}

  // ── 요약 지표 블록 (타이밍 + 지역평균) ──
  const s=calcStats(txs);
  const fh=Math.round(s.fromHigh);
  const rAvg=apt?((regionAvg[apt.lawdCd]||{})[p]||0):0;
  const aptAvg=avgPyeongPrice(txs);
  const regionDiff=(rAvg>0&&aptAvg>0)?Math.round((aptAvg-rAvg)/rAvg*100):null;
  const hilo=(s.isHigh&&txs.length>=2)?'<span class="hilo-badge hi">신고가</span>'
    :(s.isLow&&txs.length>=2)?'<span class="hilo-badge lo">신저가</span>':'';
  const dMAgo=monthsSince(s.latest.year, s.latest.month);
  const dStale=dMAgo>=6?`<span class="stale-tag">${agoLabel(dMAgo)}</span>`:'';
  const summary=`<div class="detail-summary">
    <div class="ds-item"><div class="ds-k">최근 실거래 ${dStale}</div><div class="ds-v">${formatPrice(s.latest.price)} ${hilo}</div></div>
    <div class="ds-item"><div class="ds-k">기간 고점 / 저점</div><div class="ds-v">${formatPrice(s.maxPrice)} <span class="ds-sub">/ ${formatPrice(s.minPrice)}</span></div></div>
    <div class="ds-item"><div class="ds-k">고점 대비</div><div class="ds-v ${fh<0?'down-color':'neu-color'}">${fh}%</div></div>
    <div class="ds-item"><div class="ds-k">거래량</div><div class="ds-v">${s.count}건</div></div>
    ${regionDiff!==null?`<div class="ds-item" style="grid-column:1/-1"><div class="ds-k">지역평균 대비 (평단가)</div><div class="ds-v ${regionDiff>=0?'up-color':'down-color'}">${regionDiff>=0?'+':''}${regionDiff}% <span class="ds-sub">${aptAvg.toLocaleString()} vs 지역 ${rAvg.toLocaleString()}만/평</span></div></div>`:''}
  </div>`;

  const rows=txs.map((tx,i)=>{
    const prev=txs[i+1];const diff=prev?tx.price-prev.price:null;
    // 카드와 동일 규칙: 상승=up(초록)/하락=down(빨강)
    const dh=diff!==null?`<div class="tx-diff ${diff>0?'up-color':diff<0?'down-color':'neu-color'}">${diff>0?'▲':diff<0?'▼':'─'} ${formatPrice(Math.abs(diff))}</div>`:'';
    return `<div class="tx-row"><div><div class="tx-date">${fmtDate(tx.year,tx.month,tx.day)} · ${tx.floor}층${floorBadge(tx.floor)}</div><div class="tx-detail">${pyeongStr(tx.area)}</div></div><div><div class="tx-price">${formatPrice(tx.price)}</div>${dh}</div></div>`;
  }).join('');
  body.innerHTML=summary+rows;
}

function openModal(id){const el=document.getElementById(id);el.style.display='flex';requestAnimationFrame(()=>el.classList.add('show'));}
function closeModal(id){const el=document.getElementById(id);el.classList.remove('show');setTimeout(()=>{el.style.display='none';},220);}
// 백드롭에서 '눌러서(mousedown) 뗀(click)' 경우에만 닫기.
// (모달 안에서 드래그하다 커서가 백드롭으로 나가며 뗄 때 닫히던 문제 방지)
let backdropDownTarget=null;
function onBackdropDown(e){ backdropDownTarget=e.target; }
function backdropClose(e,id){
  if(e.target===e.currentTarget && backdropDownTarget===e.currentTarget) closeModal(id);
  backdropDownTarget=null;
}
// ESC 로 열린 모달/시트 닫기
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  ['add-modal','detail-sheet'].forEach(id => {
    const el = document.getElementById(id);
    if(el && el.classList.contains('show')) closeModal(id);
  });
});

(function init(){
  updateThemeBtn();   // 조기 적용된 테마에 맞춰 버튼 아이콘 동기화
  loadStorage();
  // 시/도 셀렉트 초기화
  const cityEl = document.getElementById('city-select');
  if(cityEl){
    cityEl.innerHTML = CITIES.map(c => `<option value="${c}">${c}</option>`).join('');
    // 서울 기본 선택
    cityEl.value = '서울특별시';
    updateGuSelect('서울특별시');
  }
  document.getElementById('add-modal').style.display='none';
  document.getElementById('detail-sheet').style.display='none';
  renderGrid();
  // 카드 밀도 복원 (기본=컴팩트)
  let density='compact';
  try{ density=localStorage.getItem('apt_density')||'compact'; }catch(e){}
  setDensity(density);
  // 예산 값·체크 복원 (마지막 저장값 유지)
  try{
    const bv=localStorage.getItem('apt_budget');
    const bon=localStorage.getItem('apt_budget_on');
    const bi=document.getElementById('budget-input'), bc=document.getElementById('budget-check'), bw=document.getElementById('budget-wrap');
    if(bv!==null && bv!=='' && bi) bi.value=bv;
    if(bon!==null && bc) bc.checked=(bon==='1');
    if(bw) bw.classList.toggle('active', bc && bc.checked);
  }catch(e){}
  // 구 평균·추세선만 표시 복원
  try{ showRegionAvg=localStorage.getItem('apt_region_avg')==='1'; trendOnly=localStorage.getItem('apt_trend_only')==='1'; }catch(e){}
  const _rac=document.getElementById('region-avg-check'); if(_rac) _rac.checked=showRegionAvg;
  const _toc=document.getElementById('trend-only-check'); if(_toc) _toc.checked=trendOnly;
  syncTogglePill('region-avg-check', showRegionAvg); syncTogglePill('trend-only-check', trendOnly);
  if(apartments.length>0) refreshAll();
})();
</script>
